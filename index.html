<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FishBill – Σύντομα κοντά σας</title>
  <meta name="description" content="Κάτι νέο έρχεται. Μείνετε συνδεδεμένοι." />
  <!-- No indexing — we don't want competitors crawling us -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #040d1e;
      color: #e8edf5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Animated deep sea background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%,   rgba(13,71,161,.55) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 80%,  rgba(0,96,100,.35)  0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 20% 90%,  rgba(21,101,192,.25) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Floating particles */
    .particle {
      position: fixed;
      border-radius: 50%;
      background: rgba(56,190,201,.15);
      animation: float linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: .6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 64px 48px 56px;
      max-width: 520px;
      width: 90%;
    }

    /* Fish SVG logo */
    .logo {
      display: inline-block;
      margin-bottom: 28px;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.06); }
    }

    /* Brand name */
    .brand {
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #38bec9 0%, #7ed6df 40%, #b3e5fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 14px;
    }

    /* Tagline */
    .tagline {
      font-size: clamp(.95rem, 2.5vw, 1.1rem);
      color: rgba(232,237,245,.55);
      letter-spacing: .05em;
      font-weight: 400;
      margin-bottom: 52px;
    }

    /* Countdown display */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      border-radius: 999px;
      background: rgba(56,190,201,.1);
      border: 1px solid rgba(56,190,201,.25);
      font-size: .9rem;
      font-weight: 600;
      color: #38bec9;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 56px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bec9;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .4; transform: scale(.7); }
    }

    /* Divider */
    .divider {
      width: 40px;
      height: 1px;
      background: rgba(232,237,245,.12);
      margin: 0 auto 28px;
    }

    /* Login link — subtle, not prominent */
    .auth-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-size: .8rem;
      color: rgba(232,237,245,.3);
    }

    .auth-links a {
      color: rgba(232,237,245,.35);
      text-decoration: none;
      transition: color .2s;
      letter-spacing: .04em;
    }

    .auth-links a:hover { color: rgba(232,237,245,.65); }

    .auth-sep {
      width: 1px;
      height: 12px;
      background: rgba(232,237,245,.15);
    }

    /* Footer legal links */
    .legal {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 2;
      flex-wrap: wrap;
      padding: 0 20px;
    }

    .legal a {
      font-size: .72rem;
      color: rgba(232,237,245,.2);
      text-decoration: none;
      letter-spacing: .04em;
      transition: color .2s;
    }

    .legal a:hover { color: rgba(232,237,245,.45); }

    .legal-sep {
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(232,237,245,.15);
    }

    @media (max-width: 480px) {
      .card { padding: 48px 24px 44px; }
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div class="particle" style="width:4px;height:4px;left:15%;animation-duration:18s;animation-delay:-3s;"></div>
  <div class="particle" style="width:3px;height:3px;left:32%;animation-duration:22s;animation-delay:-8s;"></div>
  <div class="particle" style="width:5px;height:5px;left:55%;animation-duration:16s;animation-delay:-1s;"></div>
  <div class="particle" style="width:3px;height:3px;left:70%;animation-duration:24s;animation-delay:-12s;"></div>
  <div class="particle" style="width:4px;height:4px;left:85%;animation-duration:19s;animation-delay:-6s;"></div>
  <div class="particle" style="width:2px;height:2px;left:42%;animation-duration:28s;animation-delay:-15s;"></div>
  <div class="particle" style="width:6px;height:6px;left:8%;animation-duration:21s;animation-delay:-9s;"></div>

  <div class="card">

    <!-- Fish logo SVG -->
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="90" height="60">
        <path fill="#0A5568" d="M38,60 L5,32 L18,60 L5,88 Z"/>
        <path fill="#0B7285" d="M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z"/>
        <path fill="#38BEC9" d="M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z"/>
        <circle cx="138" cy="60" r="10" fill="#FFFFFF"/>
        <circle cx="138" cy="60" r="5"  fill="#064E60"/>
        <circle cx="136" cy="57" r="2.2" fill="#FFFFFF"/>
      </svg>
    </div>

    <div class="brand">FishBill</div>
    <div class="tagline">Κάτι νέο έρχεται στον κλάδο.</div>

    <div class="status-pill">
      <span class="status-dot"></span>
      Σύντομα κοντά σας
    </div>

    <div class="divider"></div>

    <div class="auth-links">
      <a id="loginLink" href="app/index.html" data-path="app/index.html">Σύνδεση</a>
      <div class="auth-sep"></div>
      <a id="regLink" href="app/index.html#register" data-path="app/index.html#register">Εγγραφή</a>
    </div>

  </div>

  <!-- Legal footer — always visible -->
  <footer class="legal" id="legalFooter">
    <a href="legal/terms.html"      data-path="legal/terms.html">Όροι Χρήσης</a>
    <div class="legal-sep"></div>
    <a href="legal/privacy.html"    data-path="legal/privacy.html">Πολιτική Απορρήτου</a>
    <div class="legal-sep"></div>
    <a href="legal/gdpr.html"       data-path="legal/gdpr.html">GDPR</a>
    <div class="legal-sep"></div>
    <a href="legal/cookies.html"    data-path="legal/cookies.html">Cookies</a>
    <div class="legal-sep"></div>
    <a href="legal/disclaimer.html" data-path="legal/disclaimer.html">Αποποίηση</a>
  </footer>

  <script>
    // Derive API host from current page hostname, port 4000
    var _apiBase = window.location.protocol + '//' + window.location.hostname + ':4000';

    // Build a clean base from current URL (strips the filename, keeps the folder path)
    function _buildBase(webBaseUrl) {
      if (webBaseUrl) return webBaseUrl.replace(/\/$/, '');
      var p = window.location.pathname.replace(/\/[^\/]*$/, '');
      return window.location.origin + (p || '');
    }

    // Apply the resolved base URL to every [data-path] anchor
    function _applyBase(base) {
      document.querySelectorAll('[data-path]').forEach(function(el) {
        var p = el.getAttribute('data-path');
        el.href = base + '/' + p;
      });
    }

    // Try to get the admin-configured web_base_url, fall back to derived value
    fetch(_apiBase + '/api/public/config', { signal: AbortSignal.timeout(3000) })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(cfg) { _applyBase(_buildBase(cfg && cfg.web_base_url || null)); })
      .catch(function()  { _applyBase(_buildBase(null)); });
  </script>

</body>
</html>
