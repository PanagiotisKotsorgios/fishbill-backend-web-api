<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FishBill – Ανάκτηση Πρόσβασης</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #0D47A1 0%, #1565C0 40%, #1976D2 70%, #42A5F5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
      text-align: center;
    }
    .logo { font-size: 32px; font-weight: 900; color: #0A5568; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 28px; }
    .title { font-size: 20px; font-weight: 800; color: #1e293b; margin-bottom: 8px; }
    .desc { font-size: 14px; color: #475569; line-height: 1.6; margin-bottom: 28px; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #e2e8f0;
      border-top-color: #0A5568;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success-icon { font-size: 48px; margin-bottom: 16px; }
    .error-icon { font-size: 48px; margin-bottom: 16px; }
    .msg { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .msg-ok { color: #059669; }
    .msg-err { color: #dc2626; }
    .detail { font-size: 13px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #0A5568, #0B7285);
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .warn-box {
      background: #fef3c7;
      border: 1px solid #fbbf24;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #92400e;
      margin-bottom: 20px;
      text-align: left;
    }
  </style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">🐟 FishBill</div>
  <div class="subtitle">Ηλεκτρονική Τιμολόγηση Αλιείας</div>
  <div class="spinner" id="spinner"></div>
  <p class="desc" id="status-text">Επαλήθευση συνδέσμου ανάκτησης…</p>
</div>

<script>
// PRODUCTION: change to your live API domain
const API = 'https://master-app.gr/api';

async function doRecovery() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const uid   = params.get('uid');

  const card = document.getElementById('card');
  const spinner = document.getElementById('spinner');
  const statusText = document.getElementById('status-text');

  if (!token || !uid) {
    showError('Άκυρος σύνδεσμος ανάκτησης.', 'Παρακαλώ ζητήστε νέο σύνδεσμο ανάκτησης.');
    return;
  }

  try {
    const resp = await fetch(`${API}/auth/owner-recovery-login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, uid }),
    });
    const data = await resp.json();

    if (!resp.ok) {
      showError('Αποτυχία ανάκτησης', data.error || 'Άκυρος ή ληγμένος σύνδεσμος.');
      return;
    }

    // Store credentials
    const { token: jwt, refresh_token, user } = data.data;
    localStorage.setItem('fishbill_token', jwt);
    localStorage.setItem('fishbill_refresh', refresh_token);
    localStorage.setItem('fishbill_user', JSON.stringify(user));

    showSuccess(user);
  } catch (err) {
    showError('Σφάλμα δικτύου', 'Δεν ήταν δυνατή η επικοινωνία με τον server. Δοκιμάστε ξανά.');
  }
}

function showSuccess(user) {
  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="logo">🐟 FishBill</div>
    <div class="subtitle">Ηλεκτρονική Τιμολόγηση Αλιείας</div>
    <div class="success-icon">✅</div>
    <div class="title">Ανάκτηση Επιτυχής!</div>
    <p class="desc">Καλώς ήρθατε, <strong>${user.full_name || user.email}</strong>.<br/>Η πρόσβασή σας αποκαταστάθηκε.</p>
    <div class="warn-box">
      ⚠️ <strong>Σημαντικό:</strong> Αλλάξτε άμεσα τον κωδικό σας από τις ρυθμίσεις προφίλ για να ασφαλίσετε τον λογαριασμό σας.
    </div>
    <a href="dashboard.html" class="btn">Πίνακας Ελέγχου →</a>
  `;
}

function showError(title, detail) {
  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="logo">🐟 FishBill</div>
    <div class="subtitle">Ηλεκτρονική Τιμολόγηση Αλιείας</div>
    <div class="error-icon">❌</div>
    <div class="title msg msg-err">${title}</div>
    <p class="detail">${detail}</p>
    <a href="index.html" class="btn">Επιστροφή στη Σύνδεση</a>
  `;
}

doRecovery();
</script>
</body>
</html>
