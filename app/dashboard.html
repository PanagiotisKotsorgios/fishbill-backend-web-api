<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FishBill – Αρχική</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Font Awesome 6 (added for calendar icon) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark:  #0D47A1;
      --blue-mid:   #1565C0;
      --blue:       #1976D2;
      --blue-light: #42A5F5;
      --border-blue: #90CAF9;      /* νέο χρώμα για περιγράμματα */
      --card-bg:    #ffffff;
      --green:      #2E7D32;
      --red:        #B71C1C;
      --orange:     #E65100;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #0D47A1 0%, #1565C0 40%, #1976D2 70%, #42A5F5 100%);
      min-height: 100vh;
      padding-bottom: 94px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .anim { animation: fadeUp .35s ease-out both; }
    .anim-1 { animation-delay: .05s; }
    .anim-2 { animation-delay: .10s; }
    .anim-3 { animation-delay: .15s; }
    .anim-4 { animation-delay: .20s; }

    /* ── LAYOUT ── */
    .page {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 16px 20px;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 40px 0 20px;
    }
    .header-logo-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;      /* μεγαλύτερο */
      height: 60px;
    }
    .header-title {
      font-size: 32px;   /* μεγαλύτερο */
      font-weight: 900;
      color: #fff;
      letter-spacing: 1.5px;
      flex: 1;
    }
    .icon-btn {
      background: rgba(255,255,255,.18);
      border: none;
      border-radius: 16px;  /* πιο στρογγυλό */
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.28); }
    .icon-btn svg { width: 26px; height: 26px; fill: #fff; }

    /* ── ΚΑΡΤΕΣ ── με μπλε περίγραμμα ── */
    .card, .stat-card, .invoice-card {
      background: var(--card-bg);
      border-radius: 24px;                /* μεγαλύτερη γωνία */
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      border: 2.5px solid var(--border-blue); /* έντονο μπλε περίγραμμα */
    }

    .greeting-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 24px;   /* μεγαλύτερο padding */
      margin-bottom: 22px;
    }
    .avatar-circle {
      width: 68px; height: 68px;  /* μεγαλύτερο */
      border-radius: 50%;
      background: linear-gradient(135deg, #1565C0, #42A5F5);
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .greeting-name {
      font-size: 24px;        /* μεγαλύτερο */
      font-weight: 800;
      color: #0D47A1;
    }
    .greeting-biz {
      font-size: 16px;        /* μεγαλύτερο */
      color: #5a6a85;
      margin-top: 4px;
    }

    /* ── STATS GRID ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);  /* now 3 cards fill width */
      gap: 14px;
      margin-bottom: 18px;
    }
    .stat-card {
      padding: 28px 22px;      /* increased for better balance */
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stat-card.full { grid-column: 1 / -1; }
    .stat-icon-wrap {
      width: 48px; height: 48px;  /* μεγαλύτερο */
      border-radius: 14px;
      background: #EFF6FF;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .stat-icon-wrap svg { width: 28px; height: 28px; }
    .stat-value {
      font-size: 38px;          /* increased size */
      font-weight: 800;
      color: #0b1e3a;
      line-height: 1.1;
    }
    .stat-label {
      font-size: 15px;          /* μεγαλύτερο */
      color: #4a5a72;
      font-weight: 600;
    }

    /* ── USAGE CARD ── */
    .usage-card {
      padding: 22px 24px;        /* μεγαλύτερο */
      margin-bottom: 18px;
    }
    .usage-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .usage-title {
      font-size: 16px;          /* μεγαλύτερο */
      font-weight: 800;
      color: #1e293b;
      flex: 1;
    }
    .progress-track {
      height: 12px;             /* παχύτερη γραμμή */
      background: #E3F0FF;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: #1976D2;
      transition: width .5s ease;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 14px;          /* μεγαλύτερο */
      font-weight: 600;
      color: #2c3e50;
    }

    /* ── QUICK ACTIONS ── */
    .quick-actions {
      display: flex;
      gap: 14px;
      margin-bottom: 22px;
    }
    .btn-action-primary {
      flex: 1;
      height: 54px;
      background: #fff;
      color: #0D47A1;
      border: 2.5px solid var(--border-blue);
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
      transition: transform .12s, box-shadow .12s;
      letter-spacing: .3px;
    }
    .btn-action-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,.18); }
    .btn-action-primary:active { transform: scale(.98); }
    .btn-action-outline {
      flex: 1;
      height: 54px;
      background: transparent;
      color: #fff;
      border: 2.5px solid rgba(255,255,255,.85);
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .12s, transform .12s;
      letter-spacing: .3px;
    }
    .btn-action-outline:hover { background: rgba(255,255,255,.15); transform: translateY(-1px); }
    .btn-action-outline:active { transform: scale(.98); }
    .btn-action-primary svg,
    .btn-action-outline svg { width: 20px; height: 20px; }
    .btn-action-primary svg { fill: #0D47A1; }
    .btn-action-outline svg { fill: #fff; }

    /* ── RECENT INVOICES ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 4px;
    }
    .section-label {
      font-size: 14px;
      font-weight: 800;
      color: rgba(255,255,255,.9);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .section-link {
      font-size: 15px;
      color: rgba(255,255,255,.95);
      font-weight: 700;
      text-decoration: none;
    }

    .invoice-card {
      padding: 18px 20px;          /* μεγαλύτερο */
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: transform .12s, box-shadow .12s;
    }
    .invoice-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.15); }
    .status-bar { width: 6px; height: 56px; border-radius: 99px; flex-shrink: 0; } /* πιο φαρδύ */
    .invoice-info { flex: 1; min-width: 0; }
    .inv-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .inv-number { font-size: 18px; font-weight: 800; color: #111; }
    .inv-amount { font-size: 18px; font-weight: 800; color: #0D47A1; }
    .inv-mid { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .inv-customer { font-size: 15px; font-weight: 600; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
    .status-badge { font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 99px; white-space: nowrap; }
    .inv-date { font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 6px; font-weight: 500; }
    .inv-chevron-icon { width: 18px; height: 18px; fill: #94a3b8; flex-shrink: 0; }

    /* ── SPINNER ── */
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ── ERROR CARD ── */
    .err-card {
      background: #FFEBEE;
      border-radius: 24px;
      padding: 28px 24px;
      color: #B71C1C;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      border: 2px solid #ef9a9a;
    }

    /* ── TRIAL CHIP ── */
    #trial-chip {
      display: none;
      align-items: center;
      background: #FFF3CD;
      color: #92400E;
      padding: 8px 14px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      text-decoration: none;
      border: 2px solid #FCD34D;
    }

    /* ── NAV BADGE ── */
    .nav-badge {
      position: absolute;
      top: -4px; right: -6px;
      min-width: 18px; height: 18px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      border-radius: 99px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
      border: 2px solid #fff;
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 82px;              /* ψηλότερο */
      background: #0D47A1;
      display: flex;
      align-items: stretch;
      box-shadow: 0 -4px 20px rgba(0,0,0,.3);
      z-index: 100;
    }
    .nav-item {
      flex: 1; position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px; text-decoration: none;
      color: rgba(255,255,255,.6);
      font-size: 14px; font-weight: 700;
      transition: all .15s;
    }
    .nav-item.active { color: #fff; background: rgba(255,255,255,.2); }
    .nav-item.active::before {
      content: ''; position: absolute; top: 0;
      left: 18%; right: 18%; height: 4px;
      background: #fff; border-radius: 0 0 4px 4px;
    }
    .nav-icon-wrap { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .nav-icon-wrap svg { width: 28px; height: 28px; fill: currentColor; }

    /* ═══════════════════════════════
       DESKTOP WIDE LAYOUT (≥ 900px)
    ═══════════════════════════════ */
    @media (min-width: 900px) {
      body { padding-bottom: 0; }

      .page {
        max-width: 1200px;        /* λίγο φαρδύτερο */
        padding: 0 40px 40px;
      }

      .header {
        padding: 36px 0 28px;
      }
      .header-title { font-size: 38px; }
      .header-logo-wrap { width: 72px; height: 72px; }
      .icon-btn { width: 56px; height: 56px; }
      .icon-btn svg { width: 28px; height: 28px; }

      .greeting-card {
        padding: 28px 32px;
        margin-bottom: 28px;
      }
      .avatar-circle { width: 80px; height: 80px; font-size: 32px; }
      .greeting-name { font-size: 28px; }
      .greeting-biz { font-size: 18px; }

      .desktop-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        align-items: start;
      }

      .stats-grid {
        grid-template-columns: repeat(3, 1fr);  /* 3 cards on desktop as well */
        gap: 18px;
        margin-bottom: 20px;
      }
      .stat-card { padding: 28px 22px; }
      .stat-value { font-size: 38px; }
      .stat-label { font-size: 16px; }
      .stat-icon-wrap { width: 52px; height: 52px; }
      .stat-icon-wrap svg { width: 30px; height: 30px; }

      .quick-actions {
        gap: 18px;
        margin-bottom: 28px;
      }
      .btn-action-primary,
      .btn-action-outline {
        height: 58px;
        font-size: 16px;
        border-radius: 16px;
      }

      .invoice-card { padding: 22px 24px; border-radius: 22px; }
      .inv-number, .inv-amount { font-size: 20px; }
      .inv-customer { font-size: 16px; }
      .status-badge { font-size: 14px; padding: 5px 14px; }
      .inv-date { font-size: 14px; }

      .bottom-nav { display: none; }
      .desktop-nav {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: 16px;
      }
      .desktop-nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 22px;
        border-radius: 16px;
        color: rgba(255,255,255,.8);
        text-decoration: none;
        font-size: 17px;
        font-weight: 700;
        transition: background .15s, color .15s;
      }
      .desktop-nav a:hover { background: rgba(255,255,255,.18); color: #fff; }
      .desktop-nav a.active { background: rgba(255,255,255,.25); color: #fff; }
      .desktop-nav a svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
    }
    @media (max-width: 899px) {
      .desktop-nav { display: none; }
      .desktop-cols { display: contents; }
    }

    /* επιπλέον μεγάλη γραμματοσειρά για κινητά */
    @media (max-width: 480px) {
      .stat-value { font-size: 30px; }
      .btn-action-primary, .btn-action-outline { font-size: 14px; }
      .greeting-name { font-size: 22px; }
    }
  </style>
</head>

  <!-- Greeting card -->

  <div class="desktop-cols">
    <div class="desktop-left">
      <div id="stats-area">
        <div style="display:flex;justify-content:center;padding:40px 0">
          <div class="spinner"></div>
        </div>
      </div>

      <div class="quick-actions anim anim-4">

        </button>
        <button class="btn-action-outline" onclick="location.href='delivery-notes.html'">
          <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-.5 1.5l1.96 2.5H17V9.5h2.5zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2.22-3c-.55-.61-1.33-1-2.22-1s-1.67.39-2.22 1H3V6h12v9H8.22zm9.78 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>

    <div class="desktop-right">
      <div id="recent-area"></div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script>
  if (!requireAuth()) throw 0;
  initCustomersNav();

  const user = T.getUser();
  if (user) {
    const first = (user.name || '').split(' ')[0];
    document.getElementById('greeting-name').textContent = first ? `Γεια σου, ${first}!` : 'Γεια σου!';
    if (user.business_name) document.getElementById('greeting-biz').textContent = user.business_name;
    const av = document.getElementById('avatar-el');
    if (user.avatar_url) {
      const fallback = (user.name||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
      av.innerHTML = `<img src="${assetUrl(user.avatar_url)}" onerror="this.parentElement.textContent='${fallback}'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
    } else {
      av.textContent = (user.name||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
    }
  }

  const STATUS_COLOR = {
    transmitted:'#2E7D32', sent:'#2E7D32', approved:'#2E7D32',
    failed:'#B71C1C', rejected:'#B71C1C',
    pending:'#E65100', pending_retry:'#E65100',
    draft:'#555555', cancelled:'#9ca3af', issued:'#1565C0'
  };
  const STATUS_LABEL = {
    transmitted:'Διαβιβάστηκε', sent:'Διαβιβάστηκε', approved:'Διαβιβάστηκε',
    failed:'Αποτυχία', rejected:'Αποτυχία',
    pending:'Εκκρεμεί', pending_retry:'Εκ νέου',
    draft:'Πρόχειρο', cancelled:'Ακυρώθηκε', issued:'Εκδόθηκε'
  };

  async function loadData() {
    document.getElementById('stats-area').innerHTML = '<div style="display:flex;justify-content:center;padding:40px 0"><div class="spinner"></div></div>';
    document.getElementById('recent-area').innerHTML = '';
    try {
      const [statsRes, subRes, recentRes, notifRes] = await Promise.all([
        api.get('/dashboard/stats'),
        api.get('/subscription/status').catch(() => null),
        api.get('/invoices', { page: 1, limit: 5 }).catch(() => null),
        api.get('/notifications', { unread: 1, limit: 1 }).catch(() => null)
      ]);

      const s = statsRes?.data?.stats || statsRes?.stats || statsRes;
      const sub = subRes?.data || subRes;

      // Redirect to subscription page if access has expired (trial ended, no paid plan)
      if (sub && sub.has_access === false) {
        window.location.replace('/fishbill/app/plan-setup.html');
        return;
      }

      renderStats(s, sub);

      if (sub?.trial_active && sub?.trial_days_remaining != null) {
        const days = sub.trial_days_remaining;
        const chip = document.getElementById('trial-chip');
        chip.style.display = 'flex';
        document.getElementById('trial-text').textContent = `${days} ημέρες δοκιμής`;
        if (days <= 3) { chip.style.background = '#FEE2E2'; chip.style.color = '#991B1B'; chip.style.borderColor = '#FCA5A5'; }
      }

      if (notifRes) {
        const count = notifRes.total || notifRes.count || (notifRes.data?.length ? '!' : 0);
        if (count) {
          ['nav-badge','desktop-nav-badge'].forEach(id => {
            const b = document.getElementById(id);
            if (b) { b.style.display = 'flex'; b.textContent = count > 9 ? '9+' : count; }
          });
        }
      }

      if (recentRes) {
        const list = recentRes.data || recentRes.invoices || [];
        renderRecent(list);
      }
    } catch(e) {
      document.getElementById('stats-area').innerHTML =
        `<div class="err-card anim">⚠️ ${e.message}<br><button onclick="loadData()" style="margin-top:10px;padding:12px 28px;background:#c62828;color:#fff;border:none;border-radius:14px;cursor:pointer;font-weight:700;font-size:18px">Δοκιμή ξανά</button></div>`;
    }
  }

  function renderStats(s, sub) {
    const hasFailed = (s.failedTransmissions || 0) > 0;

    let html = `<div class="stats-grid anim anim-2">
      <div class="stat-card">
        <div class="stat-icon-wrap">
          <svg viewBox="0 0 24 24" style="fill:#1565C0"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
        </div>
        <div class="stat-value">${s.todayInvoices || 0}</div>
        <div class="stat-label">Σήμερα</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrap">
          <svg viewBox="0 0 24 24" style="fill:#1565C0"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 15h8v2H8v-2zm0-4h8v2H8v-2zm0-4h5v2H8V7z"/></svg>
        </div>
        <div class="stat-value">${s.totalInvoices || 0}</div>
        <div class="stat-label">Σύνολο</div>
      </div>
      <!-- REMOVED: "Έσοδα Μήνα" card as requested -->
      <div class="stat-card">
        <div class="stat-icon-wrap">
          <svg viewBox="0 0 24 24" style="fill:#1565C0"><path d="M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 000 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM10 17l-3.5-3.5 1.41-1.41L10 14.17 15.18 9l1.41 1.41L10 17z"/></svg>
        </div>
        <div class="stat-value">${s.transmittedCount || 0}</div>
        <div class="stat-label">Διαβιβάστηκαν</div>
      </div>
      ${hasFailed ? `<div class="stat-card full" style="background:#FFF0F0">
        <div style="display:flex;align-items:center;gap:16px">
          <div class="stat-icon-wrap" style="background:#FFDDDD">
            <svg viewBox="0 0 24 24" style="fill:#c62828"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          </div>
          <div>
            <div class="stat-value" style="color:#c62828;font-size:30px">${s.failedTransmissions}</div>
            <div class="stat-label">Αποτυχημένες Μεταδόσεις</div>
          </div>
          <a href="invoices.html" style="margin-left:auto;padding:12px 20px;background:#c62828;color:#fff;border-radius:16px;font-size:16px;font-weight:700;text-decoration:none">Προβολή</a>
        </div>
      </div>` : ''}
    </div>`;

    if (sub) {
      const limit    = sub.monthly_limit;
      const dnLimit  = sub.monthly_dn_limit ?? limit;
      const unlimited = limit === -1 || limit === null;
      const used   = s.monthlyInvoices || 0;
      const dnUsed = s.monthlyDeliveryNotes || 0;
      const planLabel = {trial:'Δωρεάν δοκιμή', basic:'ΑΠΛΌ', pro:'ΠΡΟΧΩΡΗΜΈΝΟ', enterprise:'ΕΜΠΟΡΙΚΌ'}[sub.plan] || sub.plan;

      const invFraction = unlimited ? 0 : Math.min(used / limit, 1);
      const dnFraction  = unlimited ? 0 : Math.min(dnUsed / dnLimit, 1);
      const worstFrac   = Math.max(invFraction, dnFraction);
      const barColor    = unlimited ? '#43A047' : worstFrac >= 1 ? '#D32F2F' : worstFrac >= 0.8 ? '#F9A825' : '#1976D2';

      const progressRow = (usedVal, lim, frac, label) => {
        const color = unlimited ? '#43A047' : frac >= 1 ? '#D32F2F' : frac >= 0.8 ? '#F9A825' : '#1976D2';
        const warn  = frac >= 1 ? 'Όριο!' : frac >= 0.8 ? 'Σχεδόν στο όριο' : '';
        return `<div style="font-size:13px;font-weight:600;color:#444;margin-bottom:4px">${label}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.round(frac*100)}%;background:${color}"></div></div>
          <div class="progress-labels">
            <span>${usedVal} / ${lim}</span>
            ${warn ? `<span style="color:${color};font-weight:700">${warn}</span>` : `<span>${Math.round(frac*100)}%</span>`}
          </div>`;
      };

      html += `<div class="card usage-card anim anim-4">
        <div class="usage-header">
          <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#1565C0"><path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 0v8.99H22c-.47-4.74-4.24-8.52-8.97-8.99zm0 11.01V22c4.74-.47 8.5-4.25 8.97-8.99h-8.97z"/></svg>
          <span class="usage-title">Πλάνο ${planLabel}</span>
          <a href="subscription.html" style="font-size:16px;color:#1565C0;font-weight:700;text-decoration:none">Λεπτομέρειες</a>
        </div>
        ${unlimited
          ? `<div style="font-size:17px;color:#2c3e50;display:flex;align-items:center;gap:8px;font-weight:600">∞ Απεριόριστο · ${used} τιμολόγια · ${dnUsed} ΔΑ αυτό τον μήνα</div>`
          : `${progressRow(used, limit, invFraction, 'Τιμολόγια')}
             <div style="height:12px"></div>
             ${progressRow(dnUsed, dnLimit, dnFraction, 'Δελτία Αποστολής')}
             ${worstFrac >= 0.8 ? `<a href="subscription.html" style="display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:14px 22px;background:${barColor};color:#fff;border-radius:16px;font-size:16px;font-weight:700;text-decoration:none">↑ Αναβάθμιση</a>` : ''}`}
      </div>`;
    }

    document.getElementById('stats-area').innerHTML = html;
  }

  function renderRecent(list) {
    if (!list.length) return;
    let html = `<div class="section-header anim anim-4">
      <span class="section-label">Πρόσφατα τιμολόγια</span>
      <a href="invoices.html" class="section-link">Όλα →</a>
    </div>`;
    list.forEach((inv, i) => {
      const st = inv.status?.toLowerCase() || 'draft';
      const sc = STATUS_COLOR[st] || '#555';
      const sl = STATUS_LABEL[st] || st;
      html += `<div class="invoice-card anim" style="animation-delay:${0.18 + i * 0.04}s" onclick="location.href='invoices.html'">
        <div class="status-bar" style="background:${sc}"></div>
        <div class="invoice-info">
          <div class="inv-top">
            <span class="inv-number">${inv.invoice_number || '—'}</span>
            <span class="inv-amount">${fmtMoney(inv.total_amount)}</span>
          </div>
          <div class="inv-mid">
            <span class="inv-customer">${inv.customer_name || 'Άγνωστος πελάτης'}</span>
            <span class="status-badge" style="background:${sc}22;color:${sc}">${sl}</span>
          </div>
          <div class="inv-date">
            <i class="fa-solid fa-calendar-days"></i>
            ${fmtDate(inv.issue_date)}
          </div>
        </div>
        <svg class="inv-chevron-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </div>`;
    });
    document.getElementById('recent-area').innerHTML = html;
  }

  function logout() {
    T.clear();
    window.location = '/fishbill/app/';
  }

  loadData();

  // ── Setup call popup — FULLY BLOCKING until admin marks as parametrised ──────
  (async () => {
    if (!T.get()) return;
    try {
      const r = await apiFetch('GET', '/subscription/status');
      if (!r?.data?.subscription_active) return;
      if (r.data.is_parametrised) return; // admin confirmed — never show again
    } catch(_) { return; }

    // Build overlay — no escape, no close-on-outside-click
    const overlay = document.createElement('div');
    overlay.style.cssText = [
      'position:fixed', 'inset:0', 'background:rgba(0,0,0,.75)',
      'z-index:2147483647',   // max z-index
      'display:flex', 'align-items:center', 'justify-content:center', 'padding:20px',
      'pointer-events:all',   // consume all pointer events — nothing reaches the app
    ].join(';');
    // Stop ALL clicks from passing through
    overlay.addEventListener('click', e => e.stopPropagation());
    overlay.addEventListener('mousedown', e => e.stopPropagation());

    overlay.innerHTML = `
      <div style="background:#fff;border-radius:24px;max-width:420px;width:100%;padding:36px 28px;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.35)">
        <div style="font-size:52px;margin-bottom:10px">📞</div>
        <div style="font-size:21px;font-weight:800;color:#0D47A1;margin-bottom:10px;line-height:1.3">
          Απαιτείται Παραμετροποίηση
        </div>
        <div style="font-size:14px;color:#444;line-height:1.75;margin-bottom:22px">
          Πριν χρησιμοποιήσετε την εφαρμογή, χρειάζεται μία φορά τηλεφωνική ρύθμιση.<br>
          Καλέστε μας τώρα για να ξεκινήσουμε:
        </div>
        <a href="tel:6986788178"
           style="display:block;background:#0D47A1;color:#fff;font-size:24px;font-weight:800;padding:16px 24px;border-radius:18px;text-decoration:none;margin-bottom:14px;letter-spacing:.5px">
          📱 &nbsp;6986788178
        </a>
        <div style="font-size:13px;color:#777;line-height:1.6;margin-bottom:22px">
          Θα χρειαστεί <strong>μόνο μία φορά</strong>.<br>
          Μετά η εφαρμογή θα τρέχει μόνη της!
        </div>
        <button id="setup-check-btn"
          style="width:100%;background:#f0f4ff;color:#0D47A1;font-size:14px;font-weight:700;padding:13px;border-radius:12px;border:2px solid #c7d7f9;cursor:pointer;transition:background .2s">
          🔄 Έχει γίνει ήδη παραμετροποίηση; Ελέγξτε
        </button>
        <div id="setup-check-msg" style="margin-top:10px;font-size:12px;color:#888;min-height:18px"></div>
      </div>`;
    document.body.appendChild(overlay);

    // Block keyboard shortcuts (Escape etc.)
    const keyBlocker = e => { e.stopImmediatePropagation(); e.preventDefault(); };
    document.addEventListener('keydown', keyBlocker, true);

    async function checkAndRemove() {
      const btn = document.getElementById('setup-check-btn');
      const msg = document.getElementById('setup-check-msg');
      btn.disabled = true;
      btn.textContent = '⏳ Έλεγχος...';
      try {
        const r = await apiFetch('GET', '/subscription/status');
        if (r?.data?.is_parametrised) {
          document.removeEventListener('keydown', keyBlocker, true);
          overlay.remove();
        } else {
          msg.textContent = 'Η παραμετροποίηση δεν έχει ολοκληρωθεί ακόμη. Παρακαλώ καλέστε.';
          btn.textContent = '🔄 Έχει γίνει ήδη παραμετροποίηση; Ελέγξτε';
          btn.disabled = false;
        }
      } catch(_) {
        msg.textContent = 'Σφάλμα δικτύου. Δοκιμάστε ξανά.';
        btn.textContent = '🔄 Έχει γίνει ήδη παραμετροποίηση; Ελέγξτε';
        btn.disabled = false;
      }
    }

    document.getElementById('setup-check-btn').addEventListener('click', checkAndRemove);

    // Auto-poll every 90s in the background
    const pollId = setInterval(async () => {
      try {
        const r = await apiFetch('GET', '/subscription/status');
        if (r?.data?.is_parametrised) {
          clearInterval(pollId);
          document.removeEventListener('keydown', keyBlocker, true);
          overlay.remove();
        }
      } catch(_) {}
    }, 90000);
  })();

</script>
</body>
