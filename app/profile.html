<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FishBill – Προφίλ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ===== RESET & VARIABLES ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark:  #0D47A1;
      --blue-mid:   #1565C0;
      --blue:       #1976D2;
      --blue-light: #42A5F5;
      --border-blue: #90CAF9;
      --card-bg:    #ffffff;
      --green:      #2E7D32;
      --red:        #B71C1C;
      --orange:     #E65100;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #0D47A1 0%, #1565C0 40%, #1976D2 70%, #42A5F5 100%);
      min-height: 100vh;
      padding-bottom: 94px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes checkPop {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .anim { animation: fadeUp .35s ease-out both; }
    .anim-1 { animation-delay: .05s; }
    .anim-2 { animation-delay: .10s; }
    .anim-3 { animation-delay: .15s; }

    /* ===== LAYOUT ===== */
    .page {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 16px 20px;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 40px 0 20px;
    }
    .header-logo-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
    }
    .header-title {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 1.5px;
      flex: 1;
    }

    /* Header edit button (visible on mobile, hidden on desktop) */
    .btn-edit-header {
      background: rgba(255,255,255,.18);
      border: none;
      border-radius: 40px;
      padding: 0 20px 0 16px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-edit-header:hover { background: rgba(255,255,255,.28); }
    .btn-edit-header svg { width: 22px; height: 22px; fill: #fff; }

    /* ===== AVATAR ===== */
    .avatar-wrap {
      position: relative;
      width: 130px;
      margin: 0 auto 28px;
    }
    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1565C0, #42A5F5);
      color: #fff;
      font-size: 46px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 4px solid rgba(255,255,255,.4);
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
    .cam-btn {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 42px;
      height: 42px;
      background: #fff;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .cam-btn svg { width: 20px; height: 20px; fill: #1565C0; }

    /* ===== SNACKBAR ===== */
    .snack {
      border-radius: 14px;
      padding: 14px 20px;
      margin-bottom: 18px;
      font-size: 16px;
      font-weight: 600;
      transition: opacity .3s;
    }
    .snack.ok  { background: #E8F5E9; color: #1B5E20; }
    .snack.err { background: #FFEBEE; color: #B71C1C; }

    /* ===== SECTION LABEL ===== */
    .section-label {
      font-size: 14px;
      font-weight: 800;
      color: rgba(255,255,255,.85);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: 24px 0 14px;
      padding: 0 4px;
    }

    /* ===== CARD ===== */
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      border: 2.5px solid var(--border-blue);
      margin-bottom: 18px;
      overflow: hidden;
    }

    /* ===== PROFILE ROW ===== */
    .profile-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid #f0f0f0;
    }
    .profile-row:last-child { border-bottom: none; }
    .row-icon {
      width: 44px;
      height: 44px;
      background: #EFF6FF;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .row-icon svg { width: 22px; height: 22px; fill: #1565C0; }
    .row-label { font-size: 13px; color: #999; margin-bottom: 3px; }
    .row-value { font-size: 18px; font-weight: 600; color: #111; }

    /* ===== FORM ===== */
    .form-group { padding: 16px 22px 0; }
    .form-group:last-of-type { padding-bottom: 18px; }
    .form-label {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .form-input {
      width: 100%;
      height: 52px;
      border: 2.5px solid #E0E0E0;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 16px;
      font-family: inherit;
      color: #111;
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: #1976D2; }
    .form-input:disabled { background: #f5f5f5; color: #aaa; cursor: not-allowed; }
    .form-row { display: flex; gap: 14px; padding: 16px 22px 0; }
    .form-row .form-group { flex: 1; padding: 0; }

    /* ===== BUTTONS ===== */
    .btn-save {
      width: 100%;
      height: 72px;
      background: #0D47A1;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 1px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      transition: opacity .15s, transform .12s;
    }
    .btn-save:hover { opacity: .92; transform: translateY(-1px); }
    .btn-save:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-save svg { width: 24px; height: 24px; fill: #fff; }

    .btn-logout {
      width: 100%;
      height: 68px;
      background: transparent;
      color: #fff;
      border: 3.5px solid rgba(255,255,255,.5);
      border-radius: 20px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background .15s, transform .12s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
    .btn-logout svg { width: 22px; height: 22px; fill: #fff; }

    /* ===== SPINNER ===== */
    .spinner {
      width: 44px; height: 44px; display: block; margin: 0 auto;
      border: 4px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
    }

    /* ===== FISHERMAN CODE SECTION ===== */
    .fisherman-card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      border: 2.5px solid var(--border-blue);
      text-align: center;
      padding: 24px 20px;
      margin-bottom: 18px;
    }
    .fisherman-instruction {
      font-size: 15px;
      color: var(--blue-dark);
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 10px;
      padding: 0 10px;
    }
    .code-display-box {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: #EFF6FF;
      border: 3px solid var(--border-blue);
      border-radius: 20px;
      padding: 18px 32px;
      margin-bottom: 10px;
    }
    .code-number {
      font-size: 52px;
      font-weight: 900;
      color: var(--blue-dark);
      letter-spacing: 12px;
      font-variant-numeric: tabular-nums;
    }
    .copy-btn {
      background: rgba(13, 71, 161, 0.08);
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: background .15s, transform .1s;
      position: relative;
    }
    .copy-btn:hover { background: rgba(13, 71, 161, 0.18); }
    .copy-btn:active { transform: scale(0.95); }
    .copy-btn svg { width: 24px; height: 24px; fill: var(--blue-dark); }
    .copy-btn .copy-check {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 24px;
      height: 24px;
      fill: #2E7D32;
      animation: checkPop 0.2s ease-out;
    }
    .copy-btn.copied .copy-icon { opacity: 0; }
    .copy-btn.copied .copy-check { display: block; }
    .code-footer {
      font-size: 13px;
      color: #5a6a85;
      font-weight: 500;
    }

    /* ===== PROFILE SECTIONS CONTAINER ===== */
    .profile-sections {
      display: block;
    }

    /* ===== FAB (visible only on desktop) ===== */
    .fab {
      position: fixed;
      bottom: 40px;
      right: 40px;
      height: 72px;
      padding: 0 28px;
      background: #fff;
      border: 3px solid var(--border-blue);
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(0,0,0,.28);
      cursor: pointer;
      z-index: 50;
      display: none;  /* hidden by default, shown on desktop */
      align-items: center;
      gap: 12px;
      transition: transform .15s, box-shadow .15s;
      color: #0D47A1;
      font-size: 20px;
      font-weight: 800;
      font-family: inherit;
    }
    .fab:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(0,0,0,.32); }
    .fab svg { width: 26px; height: 26px; fill: #0D47A1; flex-shrink: 0; }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 82px;
      background: #0D47A1;
      display: flex;
      align-items: stretch;
      box-shadow: 0 -4px 20px rgba(0,0,0,.3);
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      color: rgba(255,255,255,.6);
      font-size: 14px;
      font-weight: 700;
      transition: all .15s;
    }
    .nav-item.active {
      color: #fff;
      background: rgba(255,255,255,.2);
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 18%;
      right: 18%;
      height: 4px;
      background: #fff;
      border-radius: 0 0 4px 4px;
    }
    .nav-icon-wrap { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .nav-icon-wrap svg { width: 28px; height: 28px; fill: currentColor; }

    /* ===== DESKTOP ≥900px ===== */
    @media (min-width: 900px) {
      body { padding-bottom: 0; }

      .page {
        max-width: 1200px;
        padding: 0 40px 40px;
      }

      .header {
        padding: 36px 0 28px;
      }
      .header-title { font-size: 38px; }
      .header-logo-wrap { width: 72px; height: 72px; }

      /* Hide header edit button on desktop */
      .btn-edit-header { display: none; }

      /* Show FAB on desktop */
      .fab { display: flex; }

      .avatar-wrap { width: 150px; }
      .avatar { width: 150px; height: 150px; font-size: 54px; }
      .cam-btn { width: 48px; height: 48px; }
      .cam-btn svg { width: 22px; height: 22px; }

      /* Two‑column flex layout */
      .profile-sections {
        display: flex;
        gap: 28px;
        align-items: stretch;
      }

      .profile-left {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .profile-right {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .row-value { font-size: 19px; }
      .form-input { height: 58px; font-size: 17px; }
      .btn-save { height: 80px; font-size: 24px; border-radius: 22px; }
      .btn-logout { height: 76px; font-size: 22px; border-radius: 22px; }

      .bottom-nav { display: none; }
      .desktop-nav {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: 16px;
      }
      .desktop-nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 22px;
        border-radius: 16px;
        color: rgba(255,255,255,.8);
        text-decoration: none;
        font-size: 17px;
        font-weight: 700;
        transition: background .15s, color .15s;
      }
      .desktop-nav a:hover { background: rgba(255,255,255,.18); color: #fff; }
      .desktop-nav a.active { background: rgba(255,255,255,.25); color: #fff; }
      .desktop-nav a svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
    }

    @media (max-width: 899px) {
      .desktop-nav { display: none; }
      .profile-left, .profile-right { display: contents; }
      /* Hide FAB on mobile */
      .fab { display: none; }
    }

    /* Hide text on very small screens */
    @media (max-width: 400px) {
      .btn-edit-header { padding: 0 14px; }
      .btn-edit-header span { display: none; }
    }
  </style>
</head>

      <svg id="edit-icon-header" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>

<script src="js/core.js"></script>
<script>
  if (!requireAuth()) throw 0;
  initCustomersNav();

  let editMode = false, userData = null, bizData = null;

  const cached = T.getUser() || {};
  {
    const av = document.getElementById('avatar-el');
    if (cached.avatar_url) {
      av.innerHTML = `<img src="${assetUrl(cached.avatar_url)}" onerror="this.style.display='none'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
    } else {
      av.textContent = (cached.name || '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
    }
  }

  function showSnack(msg, type = 'ok') {
    const el = document.getElementById('snack-area');
    el.innerHTML = `<div class="snack ${type}">${msg}</div>`;
    setTimeout(() => { if (el.firstChild) { el.firstChild.style.opacity = '0'; setTimeout(() => el.innerHTML = '', 300); } }, 2800);
  }

  function toggleEdit() {
    editMode = !editMode;

    // Update header button icon and text
    const headerIcon = document.getElementById('edit-icon-header');
    const headerSpan = document.querySelector('#edit-btn-header span');
    // Update FAB icon and text
    const fabIcon = document.getElementById('fab-icon');
    const fabText = document.getElementById('fab-text');

    if (editMode) {
      const cancelPath = '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';
      if (headerIcon) headerIcon.innerHTML = cancelPath;
      if (fabIcon) fabIcon.innerHTML = cancelPath;
      if (headerSpan) headerSpan.textContent = 'Ακύρωση';
      if (fabText) fabText.textContent = 'Ακύρωση';
    } else {
      const editPath = '<path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>';
      if (headerIcon) headerIcon.innerHTML = editPath;
      if (fabIcon) fabIcon.innerHTML = editPath;
      if (headerSpan) headerSpan.textContent = 'Επεξεργασία';
      if (fabText) fabText.textContent = 'Επεξεργασία Προφίλ';
    }
    render();
  }

  async function loadProfile() {
    document.getElementById('content-area').innerHTML = '<div class="spinner" style="margin:60px auto"></div>';
    try {
      const user = T.getUser();
      const uid = user?.id || user?.userId;
      const bid = user?.business_id;
      const [uRes, bRes] = await Promise.all([
        api.get(`/users/${uid || 'me'}`).catch(() => null),
        bid ? api.get(`/businesses/${bid}`).catch(() => null) : Promise.resolve(null)
      ]);
      userData = uRes?.data || uRes;
      bizData = bRes?.data || bRes;
      render();
    } catch (e) {
      document.getElementById('content-area').innerHTML = `<div style="text-align:center;padding:40px;color:rgba(255,255,255,.8);font-size:18px">${e.message}</div>`;
    }
  }

  const ROLES = { owner: 'Ιδιοκτήτης', admin: 'Διαχειριστής', accountant: 'Λογιστής', viewer: 'Παρατηρητής', captian: 'Πλοίαρχος', employee: 'Υπάλληλος' };

  const IC = {
    user: '<path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>',
    email: '<path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>',
    briefcase: '<path d="M20 6h-2.18c.07-.31.18-.61.18-.93V5c0-1.66-1.34-3-3-3h-6C7.34 2 6 3.34 6 5v.07c0 .32.11.62.18.93H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-8 10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM8 5.07V5c0-.55.45-1 1-1h6c.55 0 1 .45 1 1v.07H8z"/>',
    building: '<path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>',
    id: '<path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm-8 2.75c1.24 0 2.25 1.01 2.25 2.25s-1.01 2.25-2.25 2.25S9.75 10.24 9.75 9s1.01-2.25 2.25-2.25zM17 17H7v-.75c0-1.66 2.69-2.5 5-2.5s5 .84 5 2.5V17z"/>',
    landmark: '<path d="M12 2L2 7l1 2h1v1H3v1h18v-1h-1V9h1l1-2L12 2zm0 2.34L19.35 7H4.65L12 4.34zM6 9h2v4H6V9zm4 0h2v4h-2V9zm4 0h2v4h-2V9zM3 15h18v2H3v-2z"/>',
    pin: '<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>',
    city: '<path d="M15 11V5l-3-3-3 3v2H3v14h18V11h-6zm-8 8H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm6 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm6 12h-2v-2h2v2zm0-4h-2v-2h2v2z"/>',
    phone: '<path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>',
    tag: '<path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>',
    power: '<path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0119 12c0 3.87-3.13 7-7 7A6.995 6.995 0 015 12c0-2.28 1.09-4.3 2.58-5.42L6.17 5.17A8.932 8.932 0 003 12a9 9 0 0018 0c0-2.74-1.23-5.18-3.17-6.83z"/>',
    save: '<path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>',
  };

  function rowHtml(iconKey, label, value) {
    return `<div class="profile-row"><div class="row-icon"><svg viewBox="0 0 24 24">${IC[iconKey]}</svg></div><div><div class="row-label">${label}</div><div class="row-value">${value}</div></div></div>`;
  }

  function copyFishermanCode(code, btnElement) {
    if (!navigator.clipboard) {
      showSnack('Αντιγράψτε χειροκίνητα: ' + code, 'err');
      return;
    }
    navigator.clipboard.writeText(code).then(() => {
      btnElement.classList.add('copied');
      setTimeout(() => btnElement.classList.remove('copied'), 1500);
      showSnack('Ο κωδικός αντιγράφηκε!', 'ok');
    }).catch(() => {
      showSnack('Σφάλμα αντιγραφής', 'err');
    });
  }

  function render() {
    if (!userData) return;
    const u = userData, b = bizData;
    if (!editMode) {
      let leftHtml = `<div class="profile-left">`;
      leftHtml += `<div class="section-label anim anim-1">ΣΤΟΙΧΕΙΑ ΧΡΗΣΤΗ</div>`;
      leftHtml += `<div class="card anim anim-1">`;
      leftHtml += rowHtml('user', 'Όνομα', u.name || '—');
      leftHtml += rowHtml('email', 'Email', u.email || '—');
      leftHtml += rowHtml('briefcase', 'Ρόλος', ROLES[u.role] || u.role || '—');
      leftHtml += `</div>`;
      
      /* ΚΩΔΙΚΟΣ ΣΥΝΔΕΣΗΣ ΛΟΓΙΣΤΗ — hidden for now, kept for future use
      if (b && b.fisherman_code) {
        leftHtml += `<div class="section-label anim anim-3">ΚΩΔΙΚΟΣ ΣΥΝΔΕΣΗΣ ΛΟΓΙΣΤΗ</div>`;
        leftHtml += `<div class="fisherman-card anim anim-3">`;
        leftHtml += `<div class="fisherman-instruction">Δώστε αυτόν τον κωδικό στον λογιστή σας μαζί με το ΑΦΜ σας, για να σας συνδέσει στο FishBill.</div>`;
        leftHtml += `<div class="code-display-box">`;
        leftHtml += `<div class="code-number">${b.fisherman_code}</div>`;
        leftHtml += `<button class="copy-btn" onclick="copyFishermanCode('${b.fisherman_code}', this)">`;
        leftHtml += `<svg class="copy-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
        leftHtml += `<svg class="copy-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
        leftHtml += `</button></div>`;
        leftHtml += `<div class="code-footer">Μοναδικός κωδικός επιχείρησης · μη κοινοποιείτε σε τρίτους</div>`;
        leftHtml += `</div>`;
      }
      */
      leftHtml += `</div>`;

      let rightHtml = `<div class="profile-right">`;
      if (b) {
        rightHtml += `<div class="section-label anim anim-2">ΣΤΟΙΧΕΙΑ ΕΠΙΧΕΙΡΗΣΗΣ</div>`;
        rightHtml += `<div class="card anim anim-2">`;
        rightHtml += rowHtml('building', 'Επωνυμία', b.name || '—');
        if (b.afm) rightHtml += rowHtml('id', 'ΑΦΜ', b.afm);
        if (b.doy) rightHtml += rowHtml('landmark', 'ΔΟΥ', b.doy);
        if (b.address) rightHtml += rowHtml('pin', 'Διεύθυνση', b.address);
        if (b.city || b.postal_code) rightHtml += rowHtml('city', 'Πόλη / ΤΚ', [b.city, b.postal_code].filter(Boolean).join(' '));
        if (b.phone) rightHtml += rowHtml('phone', 'Τηλέφωνο', b.phone);
        if (b.email) rightHtml += rowHtml('email', 'Email επιχείρησης', b.email);

        rightHtml += `</div>`;
      }
      rightHtml += `</div>`;

      const html = `<div class="profile-sections">${leftHtml}${rightHtml}</div>
        <button class="btn-logout anim anim-3" onclick="logout()">
          <svg viewBox="0 0 24 24">${IC.power}</svg> Αποσύνδεση
        </button>`;
      
      document.getElementById('content-area').innerHTML = html;
    } else {
      let leftHtml = `<div class="profile-left">`;
      leftHtml += `<div class="section-label">ΣΤΟΙΧΕΙΑ ΧΡΗΣΤΗ</div>`;
      leftHtml += `<div class="card anim anim-1" style="padding:4px 0">`;
      leftHtml += `<div class="form-group"><div class="form-label">Όνομα *</div><input class="form-input" id="f-name" value="${u.name || ''}" placeholder="Ονοματεπώνυμο" /></div>`;
      leftHtml += `<div class="form-group" style="padding-bottom:18px"><div class="form-label">Email *</div><input class="form-input" id="f-email" type="email" value="${u.email || ''}" placeholder="email@example.com" /></div>`;
      leftHtml += `</div></div>`;

      let rightHtml = `<div class="profile-right">`;
      if (b) {
        rightHtml += `<div class="section-label">ΣΤΟΙΧΕΙΑ ΕΠΙΧΕΙΡΗΣΗΣ</div>`;
        rightHtml += `<div class="card anim anim-2" style="padding:4px 0">`;
        rightHtml += `<div class="form-group"><div class="form-label">Επωνυμία *</div><input class="form-input" id="f-bizname" value="${b.name || ''}" /></div>`;
        rightHtml += `<div class="form-group"><div class="form-label">Εμπορική επωνυμία</div><input class="form-input" id="f-tradename" value="${b.trade_name || ''}" /></div>`;
        rightHtml += `<div class="form-group"><div class="form-label">ΑΦΜ <span style="color:#aaa;font-weight:400">(μη επεξεργάσιμο)</span></div><input class="form-input" value="${b.afm || ''}" disabled /></div>`;
        rightHtml += `<div class="form-group"><div class="form-label">ΔΟΥ</div><input class="form-input" id="f-doy" value="${b.doy || ''}" /></div>`;
        rightHtml += `<div class="form-group"><div class="form-label">Διεύθυνση</div><input class="form-input" id="f-address" value="${b.address || ''}" /></div>`;
        rightHtml += `<div class="form-row"><div class="form-group"><div class="form-label">Πόλη</div><input class="form-input" id="f-city" value="${b.city || ''}" /></div><div class="form-group"><div class="form-label">ΤΚ</div><input class="form-input" id="f-postal" value="${b.postal_code || ''}" type="number" /></div></div>`;
        rightHtml += `<div class="form-group"><div class="form-label">Τηλέφωνο</div><input class="form-input" id="f-phone" value="${b.phone || ''}" type="tel" /></div>`;
        rightHtml += `<div class="form-group" style="padding-bottom:18px"><div class="form-label">Email επιχείρησης</div><input class="form-input" id="f-bizemail" value="${b.email || ''}" type="email" /></div>`;
        rightHtml += `</div>`;
      }
      rightHtml += `</div>`;

      const html = `<div class="profile-sections">${leftHtml}${rightHtml}</div>
        <button class="btn-save anim anim-3" id="save-btn" onclick="saveProfile()">
          <svg viewBox="0 0 24 24">${IC.save}</svg> ΑΠΟΘΗΚΕΥΣΗ
        </button>`;
      document.getElementById('content-area').innerHTML = html;
    }
  }

  async function saveProfile() {
    const name = document.getElementById('f-name')?.value?.trim();
    const email = document.getElementById('f-email')?.value?.trim();
    if (!name || !email) { showSnack('Συμπλήρωσε όνομα και email', 'err'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Αποθήκευση…';
    try {
      const uid = (T.getUser() || {}).id || (T.getUser() || {}).userId;
      await api.put(`/users/${uid}`, { name, email });
      const bid = (T.getUser() || {}).business_id;
      if (bid) {
        const p = {};
        const m = { bizname: 'name', tradename: 'trade_name', postal: 'postal_code', bizemail: 'email', activity: 'activity_code' };
        ['bizname', 'tradename', 'doy', 'address', 'city', 'postal', 'phone', 'bizemail', 'activity'].forEach(k => {
          const el = document.getElementById(`f-${k}`);
          if (el) p[m[k] || k] = el.value.trim() || null;
        });
        await api.put(`/businesses/${bid}`, p).catch(() => {});
      }
      T.setUser({ ...(T.getUser() || {}), name });
      userData = { ...userData, name, email };
      showSnack('Αποθηκεύτηκε!', 'ok');
      editMode = false;
      // Reset both button icons/text
      const editPath = '<path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>';
      document.getElementById('edit-icon-header').innerHTML = editPath;
      document.querySelector('#edit-btn-header span').textContent = 'Επεξεργασία';
      document.getElementById('fab-icon').innerHTML = editPath;
      document.getElementById('fab-text').textContent = 'Επεξεργασία Προφίλ';
      render();
    } catch (e) {
      showSnack('Σφάλμα: ' + e.message, 'err');
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#fff">${IC.save}</svg> ΑΠΟΘΗΚΕΥΣΗ`;
    }
  }

  async function uploadAvatar(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { showSnack('Η εικόνα πρέπει να είναι < 2MB', 'err'); return; }
    showSnack('Ανέβασμα…', 'ok');
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const res = await api.patch('/users/me/avatar', { avatar_base64: e.target.result, mime_type: file.type || 'image/jpeg' });
        const url = res.data?.avatar_url || res.avatar_url;
        T.setUser({ ...T.getUser(), avatar_url: url });
        if (url) document.getElementById('avatar-el').innerHTML = `<img src="${assetUrl(url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
        showSnack('Η φωτογραφία ενημερώθηκε!', 'ok');
      } catch (err) { showSnack('Σφάλμα: ' + err.message, 'err'); }
    };
    reader.readAsDataURL(file);
  }

  function logout() { T.clear(); window.location = '/fishbill/app/'; }
  loadProfile();
</script>
</body>
</html>
