<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FishBill – Εκτύπωση Δελτίου Αποστολής</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f5f7fa;
      color: #111;
    }

    /* ── Screen toolbar ── */
    .toolbar {
      background: #0D47A1; color: #fff; padding: 14px 24px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    .toolbar h1 { font-size: 18px; font-weight: 800; flex: 1; }
    .toolbar-btn {
      background: rgba(255,255,255,.18); border: none; color: #fff; border-radius: 12px;
      padding: 10px 20px; font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: inherit; display: flex; align-items: center; gap: 8px;
      transition: background .15s;
    }
    .toolbar-btn:hover { background: rgba(255,255,255,.28); }
    .toolbar-btn svg { width: 20px; height: 20px; fill: #fff; }
    .toolbar-btn.primary { background: #fff; color: #0D47A1; }
    .toolbar-btn.primary svg { fill: #0D47A1; }
    .toolbar-btn.primary:hover { background: #e8f0fe; }

    /* ── Loading / error ── */
    .state-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; gap: 16px; padding: 40px;
    }
    .state-box svg  { width: 60px; height: 60px; fill: #9CA3AF; }
    .state-box h2   { font-size: 22px; font-weight: 800; color: #374151; }
    .state-box p    { font-size: 15px; color: #6B7280; text-align: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #0D47A1; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Document ── */
    .doc-wrap { max-width: 800px; margin: 28px auto; padding: 0 20px 40px; }

    .doc {
      background: #fff; border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,.12); overflow: hidden;
    }

    /* Header band */
    .doc-header {
      background: #0D47A1; color: #fff; padding: 28px 32px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    }
    .doc-header-left { flex: 1; }
    .doc-brand { font-size: 28px; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
    .doc-brand svg { width: 44px; height: 30px; }
    .doc-type { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.7); margin-top: 4px; letter-spacing: .5px; text-transform: uppercase; }
    .doc-header-right { text-align: right; }
    .doc-number { font-size: 32px; font-weight: 900; letter-spacing: 1px; }
    .doc-date   { font-size: 14px; color: rgba(255,255,255,.75); margin-top: 4px; }
    .status-chip {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
      background: rgba(255,255,255,.2); border-radius: 20px;
      padding: 4px 12px; font-size: 13px; font-weight: 700;
    }
    .status-chip svg { width: 14px; height: 14px; fill: #fff; }

    /* Grid sections */
    .doc-body { padding: 28px 32px; }

    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
      border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden;
      margin-bottom: 24px;
    }
    .info-cell {
      padding: 16px 20px; border-right: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb;
    }
    .info-cell:nth-child(2n) { border-right: none; }
    .info-cell:nth-last-child(-n+2) { border-bottom: none; }
    .info-label { font-size: 11px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .info-value { font-size: 15px; font-weight: 600; color: #111; }
    .info-value.large { font-size: 17px; font-weight: 800; }

    /* Recipient & Sender blocks */
    .party-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .party-box { background: #F8FAFC; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; }
    .party-label { font-size: 11px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
    .party-name  { font-size: 17px; font-weight: 800; color: #0D47A1; margin-bottom: 4px; }
    .party-line  { font-size: 14px; color: #555; margin-top: 3px; }
    .party-line span { font-weight: 600; color: #222; }

    /* Section title */
    .section-title {
      font-size: 12px; font-weight: 700; color: #9CA3AF; text-transform: uppercase;
      letter-spacing: .6px; margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 2px solid #EFF6FF;
    }

    /* Lines table */
    .lines-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    .lines-table th {
      background: #EFF6FF; color: #1565C0; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px; padding: 10px 14px;
      text-align: left;
    }
    .lines-table th:last-child { text-align: right; }
    .lines-table td { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; font-size: 15px; color: #222; }
    .lines-table td:last-child { text-align: right; font-weight: 700; color: #0D47A1; }
    .lines-table tr:last-child td { border-bottom: none; }
    .lines-table .total-row td { border-top: 2px solid #e5e7eb; background: #FAFAFA; font-weight: 800; font-size: 16px; }

    /* Notes */
    .notes-box {
      background: #FFFBEB; border: 1px solid #FEF08A; border-radius: 12px;
      padding: 14px 18px; font-size: 14px; color: #713F12; line-height: 1.6; margin-bottom: 24px;
    }
    .notes-box strong { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; color: #92400E; }

    /* MARK band */
    .mark-band {
      background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 12px;
      padding: 12px 18px; display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px;
    }
    .mark-band svg { width: 22px; height: 22px; fill: #16A34A; flex-shrink: 0; }
    .mark-band strong { font-size: 13px; color: #166534; }
    .mark-band span   { font-size: 16px; font-weight: 800; color: #166534; font-family: monospace; }

    /* Footer */
    .doc-footer {
      border-top: 1px solid #e5e7eb; padding: 18px 32px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: #9CA3AF; background: #FAFAFA;
    }
    .doc-footer strong { color: #555; }

    /* ── Print styles ── */
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .doc-wrap { margin: 0; padding: 0; max-width: none; }
      .doc { border-radius: 0; box-shadow: none; }
      @page { margin: 1cm; }
    }

    /* ── Mobile ── */
    @media (max-width: 599px) {
      .doc-header { flex-direction: column; }
      .doc-header-right { text-align: left; }
      .info-grid  { grid-template-columns: 1fr; }
      .info-cell  { border-right: none; }
      .info-cell:nth-last-child(-n+2) { border-bottom: 1px solid #e5e7eb; }
      .info-cell:last-child { border-bottom: none; }
      .party-grid { grid-template-columns: 1fr; }
      .doc-body   { padding: 20px 18px; }
      .doc-header { padding: 20px 18px; }
      .doc-footer { padding: 14px 18px; flex-direction: column; gap: 6px; text-align: center; }
    }
  </style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <h1 id="toolbar-title">Δελτίο Αποστολής</h1>
  <button class="toolbar-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Πίσω
  </button>
  <button class="toolbar-btn primary" onclick="window.print()">
    <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
    Εκτύπωση / PDF
  </button>
</div>

<div id="state-container"></div>
<div id="doc-container" style="display:none"></div>

<script src="js/core.js"></script>
<script>
  if (!requireAuth()) throw 0;

  const params = new URLSearchParams(location.search);
  const noteId = params.get('id');

  const stateCont = document.getElementById('state-container');
  const docCont   = document.getElementById('doc-container');

  function showLoading() {
    stateCont.innerHTML = `<div class="state-box"><div class="spinner"></div><p>Φόρτωση δελτίου αποστολής…</p></div>`;
  }

  function showError(msg) {
    stateCont.innerHTML = `
      <div class="state-box">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <h2>Σφάλμα φόρτωσης</h2>
        <p>${msg}</p>
      </div>`;
  }

  const STATUS_LABELS = {
    transmitted: 'Διαβιβάστηκε', issued: 'Εκδόθηκε',
    draft: 'Πρόχειρο', failed: 'Αποτυχία', cancelled: 'Ακυρώθηκε',
  };
  const STATUS_COLORS = {
    transmitted: '#16A34A', issued: '#1565C0', draft: '#6B7280',
    failed: '#DC2626', cancelled: '#9CA3AF',
  };

  function fmt(d) {
    if (!d) return '—';
    const dt = new Date(d);
    return isNaN(dt) ? d : `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
  }
  function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function money(n) { const v=parseFloat(n); return isNaN(v)?'—':'€'+v.toLocaleString('el-GR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  async function load() {
    if (!noteId) { showError('Δεν ορίστηκε αριθμός δελτίου.'); return; }
    showLoading();
    try {
      const res  = await api.get(`/delivery-notes/${noteId}`);
      const d    = res.data || res.note || res;
      const lines= d.lines || [];
      const st   = (d.status||'draft').toLowerCase();
      const stLabel = STATUS_LABELS[st] || st;
      const stColor = STATUS_COLORS[st] || '#555';
      const docNum  = `${d.series||''}-${d.number||''}`;

      document.getElementById('toolbar-title').textContent = `Δελτίο Αποστολής ${docNum}`;

      /* Totals */
      const totalNet = lines.reduce((s,l)=>s+(parseFloat(l.net_amount)||0), 0);
      const hasPrice = lines.some(l=>parseFloat(l.unit_price)>0);

      /* Lines HTML */
      const linesHtml = lines.length === 0
        ? `<tr><td colspan="${hasPrice?5:3}" style="text-align:center;color:#9CA3AF;padding:20px">Δεν υπάρχουν γραμμές</td></tr>`
        : lines.map((l,i)=>`
            <tr>
              <td style="color:#666">${i+1}</td>
              <td>${esc(l.description||'—')}</td>
              <td style="text-align:right">${parseFloat(l.quantity||0).toLocaleString('el-GR',{maximumFractionDigits:3})} ${esc(l.unit||'')}</td>
              ${hasPrice?`<td style="text-align:right">${money(l.unit_price)}</td>`:''}
              ${hasPrice?`<td>${money(l.net_amount)}</td>`:''}
            </tr>`).join('');

      const totalRow = hasPrice && totalNet > 0 ? `
        <tr class="total-row">
          <td colspan="${hasPrice?3:2}"></td>
          <td style="text-align:right">Σύνολο:</td>
          <td>${money(totalNet)}</td>
        </tr>` : '';

      stateCont.innerHTML = '';
      docCont.style.display = 'block';
      docCont.innerHTML = `
        <div class="doc-wrap">
          <div class="doc">

            <!-- Header -->
            <div class="doc-header">
              <div class="doc-header-left">
                <div class="doc-brand">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120">
                    <path fill="rgba(255,255,255,.6)" d="M38,60 L5,32 L18,60 L5,88 Z"/>
                    <path fill="rgba(255,255,255,.8)" d="M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z"/>
                    <path fill="#fff" d="M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z"/>
                    <circle cx="138" cy="60" r="10" fill="rgba(255,255,255,.9)"/>
                    <circle cx="138" cy="60" r="5" fill="#0D47A1"/>
                    <circle cx="136" cy="57" r="2.2" fill="#fff"/>
                  </svg>
                  FishBill
                </div>
                <div class="doc-type">Ηλεκτρονικό Δελτίο Αποστολής</div>
                <div class="status-chip">
                  <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                  ${esc(stLabel)}
                </div>
              </div>
              <div class="doc-header-right">
                <div class="doc-number">${esc(docNum)}</div>
                <div class="doc-date">Ημ/νία: ${fmt(d.issue_date)}</div>
                ${d.dispatch_date ? `<div class="doc-date">Αποστολή: ${fmt(d.dispatch_date)}</div>` : ''}
              </div>
            </div>

            <!-- Body -->
            <div class="doc-body">

              <!-- MARK -->
              ${d.mydata_mark ? `
              <div class="mark-band">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                <div><strong>myDATA MARK</strong><span>${esc(d.mydata_mark)}</span></div>
              </div>` : ''}

              <!-- Parties -->
              <div class="party-grid">
                <div class="party-box">
                  <div class="party-label">Αποστολέας</div>
                  <div class="party-name">${esc(d.sender_name||d.business_name||'—')}</div>
                  ${d.sender_afm   ? `<div class="party-line">ΑΦΜ: <span>${esc(d.sender_afm)}</span></div>` : ''}
                  ${d.sender_address ? `<div class="party-line">${esc(d.sender_address)}</div>` : ''}
                  ${d.dispatch_location ? `<div class="party-line">Τόπος αποστολής: <span>${esc(d.dispatch_location)}</span></div>` : ''}
                </div>
                <div class="party-box">
                  <div class="party-label">Παραλήπτης</div>
                  <div class="party-name">${esc(d.recipient_name||'—')}</div>
                  ${d.recipient_afm  ? `<div class="party-line">ΑΦΜ: <span>${esc(d.recipient_afm)}</span></div>` : ''}
                  ${d.recipient_city ? `<div class="party-line">${esc(d.recipient_city)}</div>` : ''}
                  ${d.delivery_location ? `<div class="party-line">Τόπος παράδοσης: <span>${esc(d.delivery_location)}</span></div>` : ''}
                </div>
              </div>

              <!-- Transport info -->
              ${d.vehicle_plate ? `
              <div class="info-grid" style="margin-bottom:24px">
                ${d.vehicle_plate ? `<div class="info-cell"><div class="info-label">Πινακίδα οχήματος</div><div class="info-value large">${esc(d.vehicle_plate)}</div></div>` : ''}
                ${d.dispatch_date ? `<div class="info-cell"><div class="info-label">Ημ/νία αποστολής</div><div class="info-value">${fmt(d.dispatch_date)}</div></div>` : ''}
              </div>` : ''}

              <!-- Lines -->
              <div class="section-title">Γραμμές Δελτίου</div>
              <table class="lines-table">
                <thead>
                  <tr>
                    <th style="width:36px">#</th>
                    <th>Περιγραφή</th>
                    <th style="text-align:right">Ποσότητα</th>
                    ${hasPrice ? '<th style="text-align:right">Τιμή μον.</th>' : ''}
                    ${hasPrice ? '<th style="text-align:right">Αξία</th>' : ''}
                  </tr>
                </thead>
                <tbody>${linesHtml}</tbody>
                ${totalRow ? `<tfoot>${totalRow}</tfoot>` : ''}
              </table>

              <!-- Notes -->
              ${d.notes ? `
              <div class="notes-box">
                <strong>Σημειώσεις</strong>
                ${esc(d.notes)}
              </div>` : ''}

            </div><!-- /.doc-body -->

            <!-- Footer -->
            <div class="doc-footer">
              <div>Εκδόθηκε από <strong>FishBill</strong> · Ηλεκτρονική τιμολόγηση</div>
              <div>Εκτυπώθηκε: ${new Date().toLocaleDateString('el-GR')}</div>
            </div>
          </div>
        </div>`;

    } catch(e) {
      showError(e.message || 'Άγνωστο σφάλμα');
    }
  }

  load();
</script>
</body>
</html>
