<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FishBill – Πελάτες</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark:  #0D47A1;
      --blue-mid:   #1565C0;
      --blue:       #1976D2;
      --blue-light: #42A5F5;
      --border-blue: #90CAF9;
      --green:      #2E7D32;
      --red:        #B71C1C;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #0D47A1 0%, #1565C0 40%, #1976D2 70%, #42A5F5 100%);
      min-height: 100vh;
      padding-bottom: 94px;
    }

    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    .anim  { animation: fadeUp .35s ease-out both; }
    .spin  { animation: spin .7s linear infinite; }

    .page  { max-width: 500px; margin: 0 auto; padding: 0 16px 20px; }

    /* ── HEADER ── */
    .header { display:flex; align-items:center; gap:12px; padding:40px 0 20px; }
    .header-logo-wrap { flex-shrink:0; display:flex; align-items:center; justify-content:center; width:60px; height:60px; }
    .header-title { font-size:32px; font-weight:900; color:#fff; letter-spacing:1.5px; flex:1; }

    /* ── SEARCH ── */
    .search-wrap { position:relative; margin-bottom:16px; }
    .search-icon { position:absolute; left:18px; top:50%; transform:translateY(-50%); width:22px; height:22px; fill:#9E9E9E; pointer-events:none; }
    .search-input {
      width:100%; height:56px; background:rgba(255,255,255,.95);
      border:2.5px solid var(--border-blue); border-radius:24px;
      padding:0 52px 0 52px; font-size:16px; font-family:inherit; color:#111;
      outline:none; box-shadow:0 8px 24px rgba(0,0,0,.12);
    }
    .search-input:focus { border-color:var(--blue-dark); }
    .search-clear {
      position:absolute; right:16px; top:50%; transform:translateY(-50%);
      width:30px; height:30px; border:none; background:none; cursor:pointer;
      display:none; align-items:center; justify-content:center; border-radius:50%;
    }
    .search-clear svg { width:20px; height:20px; fill:#888; }
    .search-clear:hover { background:rgba(0,0,0,.06); }

    /* ── MOBILE NEW BUTTON ── */
    .btn-new-row { margin-bottom:18px; }
    .btn-new {
      width:100%; background:rgba(255,255,255,.95); border:none; border-radius:16px;
      padding:0 20px; height:56px; display:flex; align-items:center; gap:10px;
      cursor:pointer; color:var(--blue-dark); font-size:17px; font-weight:800;
      font-family:inherit; justify-content:center; box-shadow:0 4px 16px rgba(0,0,0,.18);
    }
    .btn-new svg { width:24px; height:24px; fill:var(--blue-dark); }
    .btn-new:hover { background:#fff; }

    /* ── COUNT LABEL ── */
    .count-label { font-size:14px; color:rgba(255,255,255,.75); font-weight:600; margin-bottom:10px; padding-left:4px; }

    /* ── CUSTOMER CARD ── */
    .cust-card {
      background:#fff; border-radius:20px; padding:18px 20px;
      margin-bottom:12px; box-shadow:0 4px 16px rgba(0,0,0,.13);
      cursor:pointer; transition:transform .12s, box-shadow .12s;
      display:flex; align-items:center; gap:16px;
    }
    .cust-card:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(0,0,0,.18); }
    .cust-avatar {
      width:48px; height:48px; border-radius:50%; background:var(--blue-dark);
      display:flex; align-items:center; justify-content:center;
      font-size:20px; font-weight:900; color:#fff; flex-shrink:0;
    }
    .cust-info { flex:1; min-width:0; }
    .cust-name { font-size:17px; font-weight:800; color:#111; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cust-meta { font-size:13px; color:#777; margin-top:3px; display:flex; gap:12px; flex-wrap:wrap; }
    .cust-afm  { font-size:13px; color:#555; font-weight:600; }
    .cust-stats { text-align:right; flex-shrink:0; }
    .cust-amount { font-size:16px; font-weight:800; color:var(--blue-dark); }
    .cust-count  { font-size:12px; color:#999; margin-top:2px; }
    .chevron { width:18px; height:18px; fill:#bbb; flex-shrink:0; }

    /* ── EMPTY / ERROR ── */
    .empty-state { text-align:center; padding:60px 20px; }
    .empty-icon  { width:64px; height:64px; fill:rgba(255,255,255,.4); display:block; margin:0 auto 16px; }
    .empty-title { font-size:20px; font-weight:800; color:#fff; margin-bottom:8px; }
    .empty-sub   { font-size:15px; color:rgba(255,255,255,.7); }

    .load-more-btn {
      width:100%; padding:16px; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.3);
      border-radius:16px; color:#fff; font-size:16px; font-weight:700;
      cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px;
      margin-top:8px;
    }
    .load-more-btn:hover { background:rgba(255,255,255,.22); }
    .load-more-btn svg { width:20px; height:20px; fill:#fff; }

    /* ── SPINNER ── */
    .spinner { width:32px; height:32px; border:3px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; height:68px;
      background:linear-gradient(90deg,#0D47A1,#1565C0);
      display:flex; align-items:stretch; z-index:100;
      box-shadow:0 -4px 20px rgba(0,0,0,.3);
    }
    .nav-item {
      flex:1; position:relative; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:3px;
      text-decoration:none; color:rgba(255,255,255,.6); font-size:11px; font-weight:700;
      transition:all .15s;
    }
    .nav-item.active { color:#fff; background:rgba(255,255,255,.2); }
    .nav-item.active::before { content:''; position:absolute; top:0; left:18%; right:18%; height:3px; background:#fff; border-radius:0 0 3px 3px; }
    .nav-icon-wrap { width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
    .nav-icon-wrap svg { width:24px; height:24px; fill:currentColor; }

    /* ── SHEET / DETAIL OVERLAY ── */
    .sheet-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
      z-index:300; align-items:flex-end; justify-content:center;
    }
    .sheet {
      background:#fff; border-radius:28px 28px 0 0; padding:24px 20px 40px;
      width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
      box-shadow:0 -8px 40px rgba(0,0,0,.3);
    }
    .sheet-handle { width:44px; height:5px; background:#e0e0e0; border-radius:99px; margin:0 auto 20px; }
    .sheet-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .sheet-title  { font-size:22px; font-weight:800; color:var(--blue-dark); }
    .close-btn {
      width:42px; height:42px; background:#f3f4f6; border:none; border-radius:14px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .close-btn svg { width:20px; height:20px; fill:#555; }
    .detail-row { display:flex; align-items:flex-start; gap:16px; padding:14px 0; border-bottom:1px solid #f5f5f5; }
    .detail-icon {
      width:44px; height:44px; background:#EFF6FF; border-radius:14px;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .detail-icon svg { width:22px; height:22px; fill:#1565C0; }
    .detail-label { font-size:13px; color:#999; margin-bottom:4px; }
    .detail-value { font-size:17px; font-weight:600; color:#111; }
    .detail-section { font-size:14px; font-weight:700; color:#999; text-transform:uppercase; letter-spacing:.06em; margin:20px 0 12px; }
    .action-btn {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:16px; border-radius:16px; font-size:16px; font-weight:800;
      font-family:inherit; cursor:pointer; border:none; margin-top:10px; transition:opacity .15s;
    }
    .action-btn svg { width:22px; height:22px; fill:currentColor; }
    .action-btn:hover { opacity:.87; }
    .action-btn.primary { background:var(--blue-dark); color:#fff; }
    .action-btn.danger  { background:#fef2f2; color:#b91c1c; border:1.5px solid #fecaca; }
    .action-btn:disabled { opacity:.45; cursor:not-allowed; }

    /* ── MODAL ── */
    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
      z-index:400; align-items:center; justify-content:center; padding:20px;
    }
    .modal { background:#fff; border-radius:24px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; }
    .modal-header { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 0; }
    .modal-title  { font-size:20px; font-weight:800; color:var(--blue-dark); }
    .modal-body   { padding:16px 20px; }
    .form-group   { margin-bottom:14px; }
    .form-label   { font-size:13px; font-weight:700; color:#555; margin-bottom:6px; display:block; }
    .form-input {
      width:100%; height:52px; border:2px solid #E3EAF4; border-radius:14px;
      padding:0 16px; font-size:16px; font-family:inherit; outline:none; color:#111;
    }
    .form-input:focus { border-color:var(--blue-dark); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-footer { display:flex; gap:10px; padding:0 20px 20px; }
    .btn-cancel { flex:1; height:52px; background:#f5f7fa; border:none; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; color:#555; }
    .btn-save   { flex:2; height:52px; background:var(--blue-dark); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit; }
    .btn-save:disabled { opacity:.5; cursor:not-allowed; }
    .afm-lookup-btn {
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      background:var(--blue-dark); color:#fff; border:none; border-radius:10px;
      padding:6px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
    }
    .afm-wrap { position:relative; }

    /* ── DESKTOP ── */
    @media (min-width:900px) {
      body { padding-bottom:0; }
      .page { max-width:1100px; padding:0 40px 40px; }
      .header { padding:36px 0 28px; }
      .header-title { font-size:38px; }
      .btn-new-row  { display:none; }
      .bottom-nav   { display:none; }
      .desktop-nav  { display:flex; align-items:center; gap:10px; margin-left:16px; }
      .desktop-nav a {
        display:flex; align-items:center; gap:8px; padding:12px 22px;
        border-radius:16px; color:rgba(255,255,255,.8); text-decoration:none;
        font-size:17px; font-weight:700; transition:background .15s, color .15s;
      }
      .desktop-nav a:hover { background:rgba(255,255,255,.18); color:#fff; }
      .desktop-nav a.active { background:rgba(255,255,255,.25); color:#fff; }
      .desktop-nav a svg { width:22px; height:22px; fill:currentColor; flex-shrink:0; }
      .fab {
        position:fixed; bottom:32px; right:32px; background:var(--blue-dark);
        color:#fff; border:none; border-radius:20px; padding:0 28px; height:58px;
        display:flex; align-items:center; gap:10px; cursor:pointer; font-size:17px;
        font-weight:800; font-family:inherit; box-shadow:0 8px 32px rgba(13,71,161,.45);
      }
      .fab:hover { background:#0a3d8f; }
      .fab svg { width:24px; height:24px; fill:#fff; }
      #list-area { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
      #list-area .load-more-btn { grid-column:1/-1; }
      .sheet { max-width:640px; margin:auto auto 0; border-radius:28px 28px 0 0; }
    }
    @media (max-width:899px) {
      .desktop-nav { display:none; }
      .btn-new-row  { display:block; }
      .fab { display:none; }
    }
  </style>
</head>

    <span>Πελάτες</span>

  <a href="profile.html" class="nav-item">

<!-- Detail Sheet -->
<div id="detail-overlay" class="sheet-overlay" onclick="closeDetail(event)">
  <div class="sheet" id="detail-sheet"></div>
</div>

<!-- Create/Edit Modal -->
<div id="form-overlay" class="modal-overlay" onclick="if(event.target.id==='form-overlay')closeForm()">
  <div class="modal" id="form-modal">
    <div class="modal-header">
      <span class="modal-title" id="form-title">Νέος Πελάτης</span>
      <button class="close-btn" onclick="closeForm()">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <!-- AFM lookup -->
      <div class="form-group">
        <label class="form-label">ΑΦΜ</label>
        <div class="afm-wrap">
          <input id="f-afm" class="form-input" type="text" placeholder="π.χ. 123456789" maxlength="15" oninput="onAfmInput(this.value)" style="padding-right:90px" />
          <button class="afm-lookup-btn" id="afm-lookup-btn" onclick="lookupAfm()" type="button" style="display:none">Άντλησε</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Επωνυμία <span style="color:#e53e3e">*</span></label>
        <input id="f-name" class="form-input" type="text" placeholder="Όνομα ή επωνυμία πελάτη" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Δ.Ο.Υ.</label>
          <input id="f-doy" class="form-input" type="text" placeholder="π.χ. Α΄ Πειραιά" />
        </div>
        <div class="form-group">
          <label class="form-label">Τηλέφωνο</label>
          <input id="f-phone" class="form-input" type="tel" placeholder="π.χ. 210 1234567" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="f-email" class="form-input" type="email" placeholder="email@παράδειγμα.gr" />
      </div>
      <div class="form-group">
        <label class="form-label">Διεύθυνση</label>
        <input id="f-address" class="form-input" type="text" placeholder="Οδός & αριθμός" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Πόλη</label>
          <input id="f-city" class="form-input" type="text" placeholder="π.χ. Πειραιάς" />
        </div>
        <div class="form-group">
          <label class="form-label">Τ.Κ.</label>
          <input id="f-postal" class="form-input" type="text" placeholder="π.χ. 18534" maxlength="10" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Υπεύθυνος επικοινωνίας</label>
        <input id="f-contact" class="form-input" type="text" placeholder="Ονοματεπώνυμο" />
      </div>
      <div class="form-group">
        <label class="form-label">Σημειώσεις</label>
        <input id="f-notes" class="form-input" type="text" placeholder="Προαιρετικές σημειώσεις" />
      </div>
    </div>
    <div class="form-footer">
      <button class="btn-cancel" onclick="closeForm()">Ακύρωση</button>
      <button class="btn-save" id="form-save-btn" onclick="saveCustomer()">Αποθήκευση</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script>
  if (!requireAuth()) throw 0;
  if (localStorage.getItem('fb_feat_customers') !== '1') {
    window.location.replace('dashboard.html');
    throw 0;
  }
  initCustomersNav();

  let allCustomers=[], page=1, hasMore=false, searchQuery='', searchTimer=null, editingId=null;

  /* ── Load list ── */
  async function loadCustomers(append=false) {
    if (!append) {
      page=1;
      document.getElementById('list-area').innerHTML='<div class="spinner" style="margin:60px auto"></div>';
      document.getElementById('count-label').style.display='none';
    }
    try {
      const params={page, limit:30};
      if (searchQuery) params.q=searchQuery;
      const res = await api.get('/customers', params);
      const list = res.data || [];
      hasMore = list.length === 30;
      if (append) allCustomers=[...allCustomers,...list];
      else allCustomers=list;
      renderList();
    } catch(e) {
      document.getElementById('list-area').innerHTML=`
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <div class="empty-title">Σφάλμα φόρτωσης</div>
          <div class="empty-sub">${e.message}</div>
        </div>`;
    }
  }

  function renderList() {
    const lbl = document.getElementById('count-label');
    if (allCustomers.length === 0) {
      lbl.style.display='none';
      document.getElementById('list-area').innerHTML=`
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <div class="empty-title">${searchQuery ? 'Δεν βρέθηκαν αποτελέσματα' : 'Δεν υπάρχουν πελάτες ακόμα'}</div>
          <div class="empty-sub">${searchQuery ? 'Δοκιμάστε διαφορετική αναζήτηση' : 'Προσθέστε τον πρώτο σας πελάτη'}</div>
        </div>`;
      return;
    }
    lbl.style.display='block';
    lbl.textContent=`${allCustomers.length} πελάτες`;
    let html = allCustomers.map((c,i) => {
      const initials = (c.name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      const meta = [c.afm?`ΑΦΜ: ${c.afm}`:null, c.city||null, c.phone||null].filter(Boolean).join(' · ');
      return `<div class="cust-card anim" style="animation-delay:${i*.03}s" onclick="openDetail('${c.id}')">
        <div class="cust-avatar" style="background:${hashColor(c.name)}">${initials}</div>
        <div class="cust-info">
          <div class="cust-name">${c.name}</div>
          ${meta ? `<div class="cust-meta">${meta}</div>` : ''}
        </div>
        <div class="cust-stats">
          ${c.total_amount>0 ? `<div class="cust-amount">${fmtMoney(c.total_amount)}</div>` : ''}
          ${c.invoice_count>0 ? `<div class="cust-count">${c.invoice_count} τιμολ.</div>` : ''}
        </div>
        <svg class="chevron" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </div>`;
    }).join('');
    if (hasMore && !searchQuery) {
      html += `<button class="load-more-btn" onclick="loadMore()">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Φόρτωση περισσότερων…
      </button>`;
    }
    document.getElementById('list-area').innerHTML=html;
  }

  function loadMore() { page++; loadCustomers(true); }
  function onSearch(v) {
    searchQuery=v.trim();
    document.getElementById('search-clear').style.display=searchQuery?'flex':'none';
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>loadCustomers(),350);
  }
  function clearSearch() {
    document.getElementById('search').value='';
    document.getElementById('search-clear').style.display='none';
    searchQuery='';
    loadCustomers();
  }

  /* ── Detail Sheet ── */
  async function openDetail(id) {
    const overlay = document.getElementById('detail-overlay');
    document.getElementById('detail-sheet').innerHTML='<div class="spinner" style="margin:60px auto;border-top-color:#1976D2;border-color:#e0e0e0"></div>';
    overlay.style.display='flex';
    try {
      const res = await api.get(`/customers/${id}`);
      const c = res.data || res.customer || res;
      const row = (svg,label,val,extra='') => val ? `
        <div class="detail-row">
          <div class="detail-icon"><svg viewBox="0 0 24 24">${svg}</svg></div>
          <div><div class="detail-label">${label}</div><div class="detail-value" ${extra}>${val}</div></div>
        </div>` : '';

      document.getElementById('detail-sheet').innerHTML=`
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <span class="sheet-title">${c.name}</span>
          <button class="close-btn" onclick="document.getElementById('detail-overlay').style.display='none'">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        ${row('<path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>','Email',c.email)}
        ${row('<path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>','Τηλέφωνο',c.phone)}
        ${row('<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>','Διεύθυνση',[(c.address||''),c.city,c.postal_code].filter(Boolean).join(', '))}
        ${row('<path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>','ΑΦΜ / ΔΟΥ',[(c.afm?`ΑΦΜ: ${c.afm}`:''),c.doy].filter(Boolean).join(' — '))}
        ${row('<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>','Υπεύθυνος',c.contact_person)}
        ${c.notes ? `<div class="detail-row"><div class="detail-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg></div><div><div class="detail-label">Σημειώσεις</div><div class="detail-value" style="font-size:15px">${c.notes}</div></div></div>` : ''}
        ${c.invoice_count>0 || c.total_amount>0 ? `
        <div class="detail-section">Στατιστικά</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
          <div style="background:#EFF6FF;border-radius:14px;padding:14px;text-align:center">
            <div style="font-size:22px;font-weight:900;color:var(--blue-dark)">${c.invoice_count||0}</div>
            <div style="font-size:12px;color:#666;font-weight:600">Τιμολόγια</div>
          </div>
          <div style="background:#F0FDF4;border-radius:14px;padding:14px;text-align:center">
            <div style="font-size:18px;font-weight:900;color:#166534">${fmtMoney(c.total_amount||0)}</div>
            <div style="font-size:12px;color:#666;font-weight:600">Σύνολο</div>
          </div>
        </div>` : ''}
        <button class="action-btn primary" onclick="openEdit('${id}');document.getElementById('detail-overlay').style.display='none'">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          Επεξεργασία
        </button>
        <button class="action-btn danger" id="btn-delete-${id}" onclick="deleteCustomer('${id}')">
          <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          Διαγραφή
        </button>`;
    } catch(e) {
      document.getElementById('detail-sheet').innerHTML=`
        <div class="sheet-handle"></div>
        <div style="text-align:center;padding:40px;color:#c62828">
          <svg style="width:44px;height:44px;fill:#c62828;display:block;margin:0 auto 16px" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          ${e.message}
        </div>`;
    }
  }

  function closeDetail(e) { if(e.target.id==='detail-overlay') e.target.style.display='none'; }

  /* ── Delete ── */
  async function deleteCustomer(id) {
    if (!confirm('Διαγραφή αυτού του πελάτη;')) return;
    try {
      await api.delete(`/customers/${id}`);
      document.getElementById('detail-overlay').style.display='none';
      allCustomers = allCustomers.filter(c=>c.id!==id);
      renderList();
      toast('Πελάτης διαγράφηκε','success');
    } catch(e) {
      toast('Σφάλμα: '+e.message,'error');
    }
  }

  /* ── Create / Edit form ── */
  function openCreate() {
    editingId=null;
    document.getElementById('form-title').textContent='Νέος Πελάτης';
    ['afm','name','doy','phone','email','address','city','postal','contact','notes']
      .forEach(f => { const el=document.getElementById('f-'+f); if(el) el.value=''; });
    document.getElementById('afm-lookup-btn').style.display='none';
    document.getElementById('form-overlay').style.display='flex';
  }

  async function openEdit(id) {
    editingId=id;
    document.getElementById('form-title').textContent='Επεξεργασία Πελάτη';
    document.getElementById('form-overlay').style.display='flex';
    try {
      const res = await api.get(`/customers/${id}`);
      const c = res.data || res.customer || res;
      const set = (f,v) => { const el=document.getElementById('f-'+f); if(el) el.value=v||''; };
      set('afm', c.afm); set('name', c.name); set('doy', c.doy);
      set('phone', c.phone); set('email', c.email); set('address', c.address);
      set('city', c.city); set('postal', c.postal_code); set('contact', c.contact_person);
      set('notes', c.notes);
      document.getElementById('afm-lookup-btn').style.display='none';
    } catch(e) {
      closeForm();
      toast('Σφάλμα: '+e.message,'error');
    }
  }

  function closeForm() {
    document.getElementById('form-overlay').style.display='none';
    editingId=null;
  }

  async function saveCustomer() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { toast('Συμπληρώστε το όνομα πελάτη','error'); return; }
    const btn = document.getElementById('form-save-btn');
    btn.disabled=true; btn.textContent='Αποθήκευση…';
    const body = {
      name,
      afm:           document.getElementById('f-afm').value.trim()||null,
      doy:           document.getElementById('f-doy').value.trim()||null,
      phone:         document.getElementById('f-phone').value.trim()||null,
      email:         document.getElementById('f-email').value.trim()||null,
      address:       document.getElementById('f-address').value.trim()||null,
      city:          document.getElementById('f-city').value.trim()||null,
      postal_code:   document.getElementById('f-postal').value.trim()||null,
      contact_person:document.getElementById('f-contact').value.trim()||null,
      notes:         document.getElementById('f-notes').value.trim()||null,
    };
    try {
      if (editingId) {
        await api.put(`/customers/${editingId}`, body);
        toast('Πελάτης ενημερώθηκε','success');
      } else {
        await api.post('/customers', body);
        toast('Πελάτης δημιουργήθηκε','success');
      }
      closeForm();
      loadCustomers();
    } catch(e) {
      toast('Σφάλμα: '+e.message,'error');
    } finally {
      btn.disabled=false; btn.textContent='Αποθήκευση';
    }
  }

  /* ── AFM lookup ── */
  function onAfmInput(v) {
    const btn = document.getElementById('afm-lookup-btn');
    btn.style.display = /^\d{9}$/.test(v.trim()) ? 'block' : 'none';
  }

  async function lookupAfm() {
    const afm = document.getElementById('f-afm').value.trim();
    const btn = document.getElementById('afm-lookup-btn');
    btn.disabled=true; btn.textContent='…';
    try {
      const res = await api.get('/customers/lookup-afm', {afm});
      const d = res.data || res;
      if (d.name)    document.getElementById('f-name').value=d.name;
      if (d.doy)     document.getElementById('f-doy').value=d.doy;
      if (d.address) document.getElementById('f-address').value=d.address;
      if (d.city)    document.getElementById('f-city').value=d.city;
      if (d.postal_code) document.getElementById('f-postal').value=d.postal_code;
      toast('Στοιχεία ΑΦΜ φορτώθηκαν','success');
    } catch(e) {
      toast('Σφάλμα ΓΓΠΣ: '+e.message,'error');
    } finally {
      btn.disabled=false; btn.textContent='Άντλησε';
    }
  }

  /* ── Helpers ── */
  function hashColor(name) {
    const colors = ['#0D47A1','#1565C0','#1976D2','#0277BD','#01579B','#00695C','#2E7D32','#558B2F','#4527A0','#6A1B9A'];
    let h=0; for(let i=0;i<(name||'').length;i++) h=(h*31+name.charCodeAt(i))&0xFFFFFFFF;
    return colors[Math.abs(h)%colors.length];
  }

  async function exportCsv() {
    try {
      const token = localStorage.getItem('token') || sessionStorage.getItem('token');
      const base  = window.API_BASE || 'https://master-app.gr/api';
      const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
      const res   = await fetch(`${base}/exports/customers`, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) throw new Error('Σφάλμα εξαγωγής (' + res.status + ')');
      const blob  = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `customers_export_${today}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch(e) { toast('Σφάλμα: ' + e.message, 'error'); }
  }

  loadCustomers();
