<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FishBill – Αιτήματα Πιστώσεων ΔΑ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/page.js"></script>
  <script src="js/ui.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <div id="sidebar-container"></div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-[9999] hidden">
    <div id="toast-inner" class="flex items-center gap-3 px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold min-w-60 max-w-sm text-white bg-green-600"></div>
  </div>

  <!-- Grant modal -->
  <div id="grant-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center">
          <i class="fas fa-coins text-emerald-600"></i>
        </div>
        <div>
          <h3 class="font-bold text-gray-900">Έγκριση Πιστώσεων</h3>
          <p id="grant-info" class="text-xs text-gray-500"></p>
        </div>
      </div>
      <p class="text-sm text-gray-600 mb-4">Θέλετε να εγκρίνετε αυτό το αίτημα; Οι πιστώσεις θα προστεθούν αμέσως στην επιχείρηση.</p>
      <div class="flex gap-3">
        <button onclick="closeGrantModal()" class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-50">Άκυρο</button>
        <button onclick="confirmGrant()" id="grant-confirm-btn" class="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700">
          <i class="fas fa-check mr-1.5"></i>Έγκριση
        </button>
      </div>
    </div>
  </div>

  <!-- Manual grant modal -->
  <div id="manual-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
      <h3 class="font-bold text-gray-900 mb-4"><i class="fas fa-plus-circle text-blue-600 mr-2"></i>Χειροκίνητη Χορήγηση Πιστώσεων</h3>
      <div class="space-y-3 mb-4">
        <div>
          <label class="text-xs font-semibold text-gray-500 mb-1 block">Επιχείρηση</label>
          <select id="manual-biz" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 bg-white">
            <option value="">Επιλέξτε επιχείρηση…</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500 mb-1 block">Αριθμός πιστώσεων</label>
          <input type="number" id="manual-credits" min="1" max="100" value="10"
            class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400" />
        </div>
      </div>
      <div id="manual-err" class="text-sm text-red-600 mb-3 hidden"></div>
      <div class="flex gap-3">
        <button onclick="closeManualModal()" class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-50">Άκυρο</button>
        <button onclick="submitManualGrant()" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-bold hover:bg-blue-700">
          <i class="fas fa-coins mr-1.5"></i>Χορήγηση
        </button>
      </div>
    </div>
  </div>

  <main class="ml-0 lg:ml-60 min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-8">

      <!-- Header -->
      <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
        <div>
          <h1 class="text-2xl font-extrabold text-gray-900">Πιστώσεις Δελτίων Αποστολής</h1>
          <p class="text-sm text-gray-500 mt-0.5">Αιτήματα αγοράς επιπλέον πιστώσεων από χρήστες</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="loadRequests()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-50">
            <i class="fas fa-rotate-right"></i>Ανανέωση
          </button>
          <button onclick="openManualModal()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-bold hover:bg-blue-700">
            <i class="fas fa-plus"></i>Χειροκίνητη Χορήγηση
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-white rounded-xl p-4 border border-gray-100">
          <p class="text-xs text-gray-500 mb-0.5">Εκκρεμή</p>
          <p id="stat-pending" class="text-2xl font-extrabold text-amber-600">—</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-gray-100">
          <p class="text-xs text-gray-500 mb-0.5">Εγκρίθηκαν</p>
          <p id="stat-granted" class="text-2xl font-extrabold text-emerald-600">—</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-gray-100">
          <p class="text-xs text-gray-500 mb-0.5">Συνολικές πιστώσεις</p>
          <p id="stat-total-credits" class="text-2xl font-extrabold text-blue-600">—</p>
        </div>
      </div>

      <!-- Filter -->
      <div class="flex gap-2 mb-4">
        <button onclick="filterRequests('all')" id="f-all" class="filter-btn active px-3 py-1.5 rounded-lg text-sm font-semibold bg-blue-600 text-white">Όλα</button>
        <button onclick="filterRequests('pending')" id="f-pending" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200">Εκκρεμή</button>
        <button onclick="filterRequests('granted')" id="f-granted" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200">Εγκρίθηκαν</button>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
        <div id="requests-list" class="divide-y divide-gray-50">
          <div class="flex items-center justify-center py-16 text-gray-400">
            <i class="fas fa-spinner fa-spin mr-2"></i>Φόρτωση…
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    let allRequests = [];
    let currentFilter = 'all';
    let pendingGrantId = null;

    async function loadRequests() {
      try {
        const res = await api.get('/platform/dn-credit-requests');
        allRequests = res.data || [];
        updateStats();
        renderRequests();
        loadBusinesses();
      } catch(e) {
        document.getElementById('requests-list').innerHTML =
          `<div class="text-center py-12 text-red-500"><i class="fas fa-circle-xmark mr-2"></i>${ui.esc(e.message)}</div>`;
      }
    }

    function updateStats() {
      const pending = allRequests.filter(r => r.status === 'pending').length;
      const granted = allRequests.filter(r => r.status === 'granted').length;
      const totalCred = allRequests.filter(r => r.status === 'granted').reduce((s, r) => s + r.credits, 0);
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-granted').textContent = granted;
      document.getElementById('stat-total-credits').textContent = totalCred;
    }

    function filterRequests(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-blue-600','text-white');
        b.classList.add('bg-gray-100','text-gray-600');
      });
      const active = document.getElementById('f-' + filter);
      if (active) { active.classList.add('bg-blue-600','text-white'); active.classList.remove('bg-gray-100','text-gray-600'); }
      renderRequests();
    }

    function renderRequests() {
      const filtered = currentFilter === 'all' ? allRequests : allRequests.filter(r => r.status === currentFilter);
      if (!filtered.length) {
        document.getElementById('requests-list').innerHTML =
          '<div class="text-center py-12 text-gray-400"><i class="fas fa-inbox text-3xl mb-2 block"></i>Δεν υπάρχουν αιτήματα</div>';
        return;
      }

      document.getElementById('requests-list').innerHTML = filtered.map(r => {
        const statusCfg = {
          pending:  { cls: 'bg-amber-100 text-amber-700',  label: '⏳ Εκκρεμεί' },
          granted:  { cls: 'bg-emerald-100 text-emerald-700', label: '✅ Εγκρίθηκε' },
          rejected: { cls: 'bg-red-100 text-red-700',     label: '❌ Απορρίφθηκε' },
        }[r.status] || { cls: 'bg-gray-100 text-gray-600', label: r.status };

        const date = r.requested_at ? new Date(r.requested_at).toLocaleDateString('el-GR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';

        return `
          <div class="flex items-center gap-4 px-5 py-4 hover:bg-gray-50">
            <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0">
              <i class="fas fa-coins text-blue-600 text-sm"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-bold text-gray-900 text-sm">${ui.esc(r.business_name || r.business_id)}</span>
                <span class="text-xs text-gray-400">ΑΦΜ ${ui.esc(r.business_afm || '—')}</span>
              </div>
              <div class="flex items-center gap-3 mt-0.5 flex-wrap text-xs text-gray-500">
                <span><i class="fas fa-file-lines mr-1"></i><strong class="text-blue-700">+${r.credits}</strong> δελτία</span>
                <span><i class="fas fa-euro-sign mr-1"></i>€${parseFloat(r.amount_eur || 0).toFixed(2)}</span>
                <span><i class="fas fa-clock mr-1"></i>${date}</span>
                ${r.notes ? `<span class="italic">"${ui.esc(r.notes)}"</span>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${statusCfg.cls}">${statusCfg.label}</span>
              ${r.status === 'pending' ? `
                <button onclick="openGrantModal('${r.id}', '${ui.esc(r.business_name)}', ${r.credits})"
                  class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700">
                  <i class="fas fa-check mr-1"></i>Έγκριση
                </button>
                <button onclick="rejectRequest('${r.id}')"
                  class="px-3 py-1.5 rounded-lg border border-red-200 text-red-600 text-xs font-semibold hover:bg-red-50">
                  <i class="fas fa-xmark mr-1"></i>Απόρριψη
                </button>
              ` : ''}
            </div>
          </div>`;
      }).join('');
    }

    function openGrantModal(id, name, credits) {
      pendingGrantId = id;
      document.getElementById('grant-info').textContent = `${name} — +${credits} δελτία`;
      document.getElementById('grant-modal').classList.replace('hidden','flex');
    }
    function closeGrantModal() {
      document.getElementById('grant-modal').classList.replace('flex','hidden');
      pendingGrantId = null;
    }
    async function confirmGrant() {
      if (!pendingGrantId) return;
      const btn = document.getElementById('grant-confirm-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i>…';
      try {
        await api.post(`/platform/dn-credit-requests/${pendingGrantId}/grant`, {});
        closeGrantModal();
        showToast('Οι πιστώσεις εγκρίθηκαν!', 'ok');
        loadRequests();
      } catch(e) {
        showToast(e.message, 'err');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check mr-1.5"></i>Έγκριση';
      }
    }

    async function rejectRequest(id) {
      if (!confirm('Να απορριφθεί αυτό το αίτημα;')) return;
      try {
        await api.post(`/platform/dn-credit-requests/${id}/reject`, {});
        showToast('Αίτημα απορρίφθηκε.', 'ok');
        loadRequests();
      } catch(e) { showToast(e.message, 'err'); }
    }

    // ── Manual grant ──────────────────────────────────────────────────────────
    let allBusinesses = [];

    async function loadBusinesses() {
      try {
        const res = await api.get('/configure/businesses', { per_page: 500 });
        allBusinesses = res.businesses || res.data || [];
        const sel = document.getElementById('manual-biz');
        sel.innerHTML = '<option value="">Επιλέξτε επιχείρηση…</option>' +
          allBusinesses.map(b => `<option value="${b.id}">${ui.esc(b.name)} (${b.afm})</option>`).join('');
      } catch(_) {}
    }

    function openManualModal() {
      document.getElementById('manual-err').classList.add('hidden');
      document.getElementById('manual-modal').classList.replace('hidden','flex');
    }
    function closeManualModal() {
      document.getElementById('manual-modal').classList.replace('flex','hidden');
    }

    async function submitManualGrant() {
      const bizId   = document.getElementById('manual-biz').value;
      const credits = parseInt(document.getElementById('manual-credits').value) || 0;
      const errEl   = document.getElementById('manual-err');
      errEl.classList.add('hidden');
      if (!bizId)    { errEl.textContent = 'Επιλέξτε επιχείρηση.'; errEl.classList.remove('hidden'); return; }
      if (credits < 1) { errEl.textContent = 'Εισάγετε θετικό αριθμό πιστώσεων.'; errEl.classList.remove('hidden'); return; }
      try {
        await api.post(`/platform/businesses/${bizId}/grant-dn-credits`, { credits });
        closeManualModal();
        showToast(`Χορηγήθηκαν ${credits} πιστώσεις!`, 'ok');
      } catch(e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
      }
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _tt;
    function showToast(msg, type='ok') {
      const el = document.getElementById('toast');
      const inner = document.getElementById('toast-inner');
      inner.className = `flex items-center gap-3 px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold min-w-60 max-w-sm text-white ${type==='ok'?'bg-green-600':'bg-red-600'}`;
      inner.innerHTML = `<i class="fas ${type==='ok'?'fa-circle-check':'fa-circle-xmark'}"></i><span>${ui.esc(msg)}</span>`;
      el.classList.remove('hidden');
      clearTimeout(_tt);
      _tt = setTimeout(() => el.classList.add('hidden'), 4000);
    }

    loadRequests();
  </script>
</body>
</html>
