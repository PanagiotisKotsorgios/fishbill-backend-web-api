<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FishBill – myDATA Μεταδόσεις</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .anim { animation: fadeUp .3s ease-out both; }
    .status-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:700; }
    .sk { background:#e5e7eb; border-radius:6px; animation:sk-pulse 1.5s ease-in-out infinite; }
    @keyframes sk-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="sidebar-container"></div>
  <div class="pt-14 lg:pt-0 min-h-screen">
    <main class="p-6">

      <!-- Header -->
      <div class="mb-6 anim">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 class="text-2xl font-bold text-gray-900">myDATA — Μεταδόσεις</h1>
            <p class="text-sm text-gray-500 mt-0.5">Ιστορικό αποστολής παραστατικών στην ΑΑΔΕ</p>
          </div>
          <div class="flex gap-2 flex-wrap">
            <button onclick="testConnection()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 text-gray-700 rounded-xl text-sm font-medium hover:bg-gray-50 transition-colors shadow-sm">
              <i class="fas fa-bolt mr-1.5"></i>Δοκιμή Σύνδεσης
            </button>
            <button onclick="retryFailed()" class="flex items-center gap-2 px-4 py-2 bg-orange-500 text-white rounded-xl text-sm font-semibold hover:bg-orange-600 transition-colors shadow-sm">
              <i class="fas fa-rotate-right mr-1.5"></i>Επανάληψη Αποτυχιών
            </button>
          </div>
        </div>
      </div>

      <!-- Toast -->
      <div id="toast" class="hidden fixed top-4 right-4 z-50 max-w-sm px-4 py-3 rounded-xl shadow-lg text-sm font-semibold transition-all"></div>

      <!-- Summary stats -->
      <div id="stats-row" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6 anim" style="animation-delay:.05s">
        <div class="sk h-20 rounded-xl"></div>
        <div class="sk h-20 rounded-xl"></div>
        <div class="sk h-20 rounded-xl"></div>
        <div class="sk h-20 rounded-xl"></div>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-5 anim" style="animation-delay:.08s">
        <div class="flex flex-wrap gap-3 items-center">
          <select id="filter-status" onchange="loadLogs(1)" class="border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-300">
            <option value="">Όλες οι καταστάσεις</option>
            <option value="success">Επιτυχία</option>
            <option value="failed">Αποτυχία</option>
            <option value="pending">Εκκρεμεί</option>
          </select>
          <select id="filter-service" onchange="loadLogs(1)" class="border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-300">
            <option value="">Όλες οι υπηρεσίες</option>
            <option value="mydata">myDATA Direct</option>
            <option value="epsilonnet">EpsilonNet</option>
            <option value="softone">SoftOne</option>
            <option value="unidoc">UniDoc</option>
          </select>
          <input id="filter-date-from" type="date" onchange="loadLogs(1)" class="border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Από" />
          <input id="filter-date-to" type="date" onchange="loadLogs(1)" class="border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="Έως" />
          <button onclick="loadLogs(1)" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-medium hover:bg-blue-700 transition-colors">
            Εφαρμογή
          </button>
          <button onclick="clearFilters()" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-xl text-sm font-medium hover:bg-gray-200 transition-colors">
            Καθαρισμός
          </button>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden anim" style="animation-delay:.1s">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-gray-100 bg-gray-50">
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Παραστατικό</th>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Υπηρεσία</th>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Ενέργεια</th>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Κατάσταση</th>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">MARK</th>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Ημερομηνία</th>
                <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Ενέργειες</th>
              </tr>
            </thead>
            <tbody id="logs-tbody">
              <tr><td colspan="7" class="text-center py-10 text-gray-400">Φόρτωση...</td></tr>
            </tbody>
          </table>
        </div>
        <!-- Pagination -->
        <div id="pagination" class="px-4 py-3 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500"></div>
      </div>

      <!-- Pending invoices (not yet transmitted) -->
      <div class="mt-6 bg-white rounded-2xl shadow-sm border border-orange-100 overflow-hidden anim" style="animation-delay:.15s">
        <div class="flex items-center justify-between px-5 py-4 border-b border-orange-100 bg-orange-50">
          <h2 class="font-semibold text-orange-800 flex items-center gap-2"><i class="fas fa-triangle-exclamation text-orange-600 mr-1.5"></i>Παραστατικά χωρίς MARK</h2>
          <span id="pending-count" class="text-xs font-bold bg-orange-200 text-orange-800 px-2 py-0.5 rounded-full">…</span>
        </div>
        <div id="pending-invoices" class="p-4 text-sm text-gray-500">Φόρτωση…</div>
      </div>

    </main>
  </div>

  <!-- Detail modal -->
  <div id="detail-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[80vh] overflow-y-auto">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
        <h3 class="font-bold text-gray-900">Λεπτομέρειες Μετάδοσης</h3>
        <button onclick="closeModal()" class="p-1 text-gray-400 hover:text-gray-600 rounded-lg">✕</button>
      </div>
      <div id="modal-body" class="p-5"></div>
    </div>
  </div>

  <script src="js/config.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    requireAuth();
    buildSidebar();

    let currentPage = 1;
    const pageSize = 25;

    // ── Toast ─────────────────────────────────────────────────────────────────
    function toast(msg, type = 'ok') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `fixed top-4 right-4 z-50 max-w-sm px-4 py-3 rounded-xl shadow-lg text-sm font-semibold ${
        type === 'ok' ? 'bg-green-600 text-white' : 'bg-red-500 text-white'
      }`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    // ── Stats ────────────────────────────────────────────────────────────────
    async function loadStats() {
      try {
        const r = await api.get('/integrations/logs', { limit: 1000 });
        const logs = r.data || [];
        const total = r.total || logs.length;
        const success = logs.filter(l => l.status === 'success').length;
        const failed  = logs.filter(l => l.status === 'failed').length;

        // Get full count via a separate call if needed
        const [allR] = await Promise.all([api.get('/integrations/logs', { limit: 1, status: 'failed' })]);
        const failedTotal = allR.total || failed;

        document.getElementById('stats-row').innerHTML = `
          <div class="bg-white rounded-xl border border-gray-100 p-5 shadow-sm">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Σύνολο</p>
            <p class="text-2xl font-extrabold text-gray-900 mt-1">${total}</p>
            <p class="text-xs text-gray-400 mt-1">Μεταδόσεις</p>
          </div>
          <div class="bg-white rounded-xl border border-green-100 p-5 shadow-sm">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Επιτυχία</p>
            <p class="text-2xl font-extrabold text-green-600 mt-1">${success}</p>
            <p class="text-xs text-gray-400 mt-1">Με MARK</p>
          </div>
          <div class="bg-white rounded-xl border border-red-100 p-5 shadow-sm">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Αποτυχίες</p>
            <p class="text-2xl font-extrabold text-red-500 mt-1">${failedTotal}</p>
            <p class="text-xs text-gray-400 mt-1">Χρειάζεται ενέργεια</p>
          </div>
          <div class="bg-white rounded-xl border border-blue-100 p-5 shadow-sm">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Εκκρεμούν</p>
            <p class="text-2xl font-extrabold text-blue-500 mt-1" id="pending-stat">…</p>
            <p class="text-xs text-gray-400 mt-1">Αναμονή μετάδοσης</p>
          </div>
        `;
      } catch (e) {
        document.getElementById('stats-row').innerHTML = `<div class="col-span-4 text-sm text-red-500 py-4 px-2">Σφάλμα φόρτωσης: ${e.message}</div>`;
      }
    }

    // ── Logs table ────────────────────────────────────────────────────────────
    async function loadLogs(page = 1) {
      currentPage = page;
      const tbody = document.getElementById('logs-tbody');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10"><div class="sk h-4 w-32 mx-auto rounded"></div></td></tr>`;

      const dateFrom = document.getElementById('filter-date-from').value;
      const dateTo   = document.getElementById('filter-date-to').value;
      const params = {
        page,
        limit: pageSize,
        status:  document.getElementById('filter-status').value  || undefined,
        service: document.getElementById('filter-service').value || undefined,
        from:    dateFrom || undefined,
        to:      dateTo ? dateTo + 'T23:59:59' : undefined,
      };

      try {
        const r = await api.get('/integrations/logs', params);
        const logs = r.data || [];
        const total = r.total || 0;

        if (!logs.length) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-gray-400 text-sm">Δεν βρέθηκαν εγγραφές</td></tr>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        tbody.innerHTML = logs.map(log => {
          const statusBadge = log.status === 'success'
            ? `<span class="status-badge bg-green-100 text-green-700">✓ Επιτυχία</span>`
            : log.status === 'failed'
            ? `<span class="status-badge bg-red-100 text-red-700">✗ Αποτυχία</span>`
            : `<span class="status-badge bg-yellow-100 text-yellow-700">⏳ Εκκρεμεί</span>`;

          const mark = log.mark ? `<span class="font-mono text-xs bg-green-50 text-green-800 px-2 py-0.5 rounded">${log.mark}</span>` : `<span class="text-gray-300 text-xs">—</span>`;

          const dt = log.created_at ? new Date(log.created_at).toLocaleString('el-GR') : '—';
          const svc = log.service || '—';
          const action = log.action || '—';
          const invId = log.metadata ? (JSON.parse(log.metadata || '{}').invoice_id || '') : '';

          return `<tr class="border-b border-gray-50 hover:bg-gray-50 transition-colors">
            <td class="px-4 py-3">
              ${invId ? `<a href="invoices.html#${invId}" class="text-blue-600 hover:underline font-mono text-xs">${invId.slice(0,8)}…</a>` : '<span class="text-gray-300 text-xs">—</span>'}
            </td>
            <td class="px-4 py-3 text-xs font-medium text-gray-700">${svc}</td>
            <td class="px-4 py-3 text-xs text-gray-600">${action}</td>
            <td class="px-4 py-3">${statusBadge}</td>
            <td class="px-4 py-3">${mark}</td>
            <td class="px-4 py-3 text-xs text-gray-500">${dt}</td>
            <td class="px-4 py-3">
              <div class="flex gap-1">
                <button onclick='showDetail(${JSON.stringify(log)})' class="px-2 py-1 text-xs bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-colors">Λεπτ.</button>
                ${invId && log.status === 'failed' ? `<button onclick="transmitInvoice('${invId}')" class="px-2 py-1 text-xs bg-orange-100 text-orange-700 rounded-lg hover:bg-orange-200 transition-colors">Επανάληψη</button>` : ''}
              </div>
            </td>
          </tr>`;
        }).join('');

        // Pagination
        const pages = Math.ceil(total / pageSize);
        if (pages > 1) {
          let pagesHtml = `<span class="text-xs text-gray-400">Σελίδα ${page} / ${pages} (${total} εγγραφές)</span>`;
          pagesHtml += `<div class="flex gap-1">`;
          if (page > 1) pagesHtml += `<button onclick="loadLogs(${page-1})" class="px-3 py-1 text-xs bg-gray-100 rounded-lg hover:bg-gray-200">← Προηγ.</button>`;
          if (page < pages) pagesHtml += `<button onclick="loadLogs(${page+1})" class="px-3 py-1 text-xs bg-gray-100 rounded-lg hover:bg-gray-200">Επόμ. →</button>`;
          pagesHtml += `</div>`;
          document.getElementById('pagination').innerHTML = pagesHtml;
        } else {
          document.getElementById('pagination').innerHTML = `<span class="text-xs text-gray-400">${total} εγγραφές</span>`;
        }
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-500 text-sm">Σφάλμα: ${e.message}</td></tr>`;
      }
    }

    // ── Pending invoices ──────────────────────────────────────────────────────
    async function loadPendingInvoices() {
      try {
        const r = await api.get('/invoices', { status: 'issued', limit: 20 });
        const invoices = (r.data || []).filter(inv => !inv.mydata_mark);
        document.getElementById('pending-count').textContent = invoices.length;
        if (document.getElementById('pending-stat')) {
          document.getElementById('pending-stat').textContent = invoices.length;
        }

        if (!invoices.length) {
          document.getElementById('pending-invoices').innerHTML = `<p class="text-sm text-green-600 font-medium py-2">✓ Όλα τα παραστατικά έχουν μεταδοθεί!</p>`;
          return;
        }

        document.getElementById('pending-invoices').innerHTML = `
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="text-left text-xs font-semibold text-gray-400 uppercase">
                <th class="pb-2 pr-4">Αριθμός</th>
                <th class="pb-2 pr-4">Πελάτης</th>
                <th class="pb-2 pr-4">Ημερ/νία</th>
                <th class="pb-2 pr-4">Αξία</th>
                <th class="pb-2">Αποστολή</th>
              </tr></thead>
              <tbody>
                ${invoices.map(inv => `
                  <tr class="border-t border-gray-50">
                    <td class="py-2 pr-4 font-mono text-xs text-blue-600">${inv.full_number || inv.number}</td>
                    <td class="py-2 pr-4 text-gray-700">${inv.customer_name || '—'}</td>
                    <td class="py-2 pr-4 text-gray-500 text-xs">${inv.issue_date ? new Date(inv.issue_date).toLocaleDateString('el-GR') : '—'}</td>
                    <td class="py-2 pr-4 text-gray-900 font-semibold">€${parseFloat(inv.total_value||0).toLocaleString('el-GR',{minimumFractionDigits:2})}</td>
                    <td class="py-2">
                      <button onclick="transmitInvoice('${inv.id}')" class="px-3 py-1 bg-blue-600 text-white text-xs font-semibold rounded-lg hover:bg-blue-700 transition-colors">
                        Αποστολή →
                      </button>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (e) {
        document.getElementById('pending-invoices').innerHTML = `<p class="text-sm text-red-500">Σφάλμα: ${e.message}</p>`;
      }
    }

    // ── Transmit single invoice ───────────────────────────────────────────────
    async function transmitInvoice(invoiceId) {
      if (!confirm('Αποστολή παραστατικού στη ΑΑΔΕ;')) return;
      try {
        toast('Αποστολή σε εξέλιξη…', 'ok');
        const r = await api.post('/integrations/provider/transmit', { invoice_id: invoiceId });
        if (r.data && r.data.mark) {
          toast(`✓ Επιτυχία! MARK: ${r.data.mark}`, 'ok');
        } else {
          toast('Αποστολή ολοκληρώθηκε', 'ok');
        }
        setTimeout(() => { loadLogs(currentPage); loadPendingInvoices(); loadStats(); }, 1000);
      } catch (e) {
        toast(`Σφάλμα: ${e.message}`, 'err');
      }
    }

    // ── Retry all failed ──────────────────────────────────────────────────────
    async function retryFailed() {
      if (!confirm('Επανάληψη όλων των αποτυχημένων μεταδόσεων;')) return;
      try {
        const r = await api.post('/integrations/retry-failed', {});
        toast(`Εκκίνηση επανάληψης για ${r.data?.count || 0} παραστατικά`, 'ok');
        setTimeout(() => { loadLogs(1); loadStats(); }, 2000);
      } catch (e) {
        toast(`Σφάλμα: ${e.message}`, 'err');
      }
    }

    // ── Test connection ───────────────────────────────────────────────────────
    async function testConnection() {
      try {
        toast('Έλεγχος σύνδεσης…', 'ok');
        const r = await api.post('/integrations/provider/test', {});
        const d = r.data || {};
        toast(`✓ ${d.provider || 'Provider'}: ${d.note || 'OK'}`, 'ok');
      } catch (e) {
        toast(`Αποτυχία σύνδεσης: ${e.message}`, 'err');
      }
    }

    // ── Detail modal ─────────────────────────────────────────────────────────
    function showDetail(log) {
      let meta = {};
      try { meta = JSON.parse(log.metadata || '{}'); } catch(e) {}

      document.getElementById('modal-body').innerHTML = `
        <div class="space-y-3 text-sm">
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-gray-50 rounded-xl p-3">
              <p class="text-xs text-gray-400 font-medium uppercase mb-1">Υπηρεσία</p>
              <p class="font-semibold text-gray-800">${log.service || '—'}</p>
            </div>
            <div class="bg-gray-50 rounded-xl p-3">
              <p class="text-xs text-gray-400 font-medium uppercase mb-1">Ενέργεια</p>
              <p class="font-semibold text-gray-800">${log.action || '—'}</p>
            </div>
            <div class="bg-gray-50 rounded-xl p-3">
              <p class="text-xs text-gray-400 font-medium uppercase mb-1">Κατάσταση</p>
              <p class="font-semibold ${log.status==='success'?'text-green-600':log.status==='failed'?'text-red-500':'text-yellow-600'}">${log.status || '—'}</p>
            </div>
            <div class="bg-gray-50 rounded-xl p-3">
              <p class="text-xs text-gray-400 font-medium uppercase mb-1">MARK</p>
              <p class="font-mono text-xs font-semibold text-gray-800">${log.mark || '—'}</p>
            </div>
          </div>
          ${log.error_message ? `<div class="bg-red-50 border border-red-100 rounded-xl p-3"><p class="text-xs font-semibold text-red-600 mb-1">Σφάλμα</p><p class="text-xs text-red-700 font-mono whitespace-pre-wrap">${log.error_message}</p></div>` : ''}
          ${Object.keys(meta).length ? `<div class="bg-blue-50 border border-blue-100 rounded-xl p-3"><p class="text-xs font-semibold text-blue-700 mb-1">Metadata</p><pre class="text-xs text-blue-800 whitespace-pre-wrap overflow-auto">${JSON.stringify(meta, null, 2)}</pre></div>` : ''}
          <p class="text-xs text-gray-400 text-right">${log.created_at ? new Date(log.created_at).toLocaleString('el-GR') : ''}</p>
        </div>
      `;
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function clearFilters() {
      document.getElementById('filter-status').value = '';
      document.getElementById('filter-service').value = '';
      document.getElementById('filter-date-from').value = '';
      document.getElementById('filter-date-to').value = '';
      loadLogs(1);
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    loadStats();
    loadLogs(1);
    loadPendingInvoices();

    window.transmitInvoice = transmitInvoice;
    window.retryFailed     = retryFailed;
    window.testConnection  = testConnection;
    window.showDetail      = showDetail;
    window.closeModal      = closeModal;
    window.clearFilters    = clearFilters;
    window.loadLogs        = loadLogs;
  </script>
</body>
</html>
