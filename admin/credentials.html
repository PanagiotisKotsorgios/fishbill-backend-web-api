<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FishBill – Θησαυροφυλάκιο</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .anim { animation: fadeUp .3s ease-out both; }
    .anim-1 { animation-delay:.05s; } .anim-2 { animation-delay:.1s; } .anim-3 { animation-delay:.15s; }

    /* Credential card */
    .cred-card { transition: box-shadow .2s; }
    .cred-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .cred-section { border-left: 3px solid; padding-left: 12px; margin-bottom: 18px; }

    /* Input field row */
    .cred-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    @media (max-width: 640px) { .cred-row { grid-template-columns: 1fr; } }

    /* Password input wrapper */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 72px !important; }
    .pw-actions { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; }
    .pw-btn { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; font-size: 12px; border: none; }
    .pw-btn:hover { background: #e5e7eb; }
    .pw-btn.copy-ok { background: #d1fae5; color: #065f46; }

    /* Copy flash on input */
    @keyframes inputFlash { 0%,100%{border-color:#d1d5db;} 40%{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15);} }
    .copy-flash { animation: inputFlash .9s ease; }

    /* Floating "Αντιγράφηκε!" toast */
    @keyframes copyPop {
      0%   { opacity:0; transform:translateY(2px) scale(.85); }
      18%  { opacity:1; transform:translateY(-6px) scale(1); }
      75%  { opacity:1; transform:translateY(-8px) scale(1); }
      100% { opacity:0; transform:translateY(-14px) scale(.9); }
    }
    .copy-toast {
      position:absolute; bottom:calc(100% + 4px); right:0;
      background:#065f46; color:#fff; font-size:10px; font-weight:700;
      padding:3px 8px; border-radius:6px; pointer-events:none;
      white-space:nowrap; animation:copyPop 1.3s ease-out forwards; z-index:50;
    }

    /* Filter chips */
    .f-chip { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:99px;
      font-size:12px; font-weight:600; border:1.5px solid; cursor:pointer; transition:all .15s; white-space:nowrap; }
    .f-chip.active  { background:#d97706; border-color:#d97706; color:#fff; }
    .f-chip.inactive{ background:#fff; border-color:#e5e7eb; color:#6b7280; }
    .f-chip.inactive:hover { border-color:#d97706; color:#d97706; }

    /* Accordion */
    .acc-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
    .acc-body.open { max-height: 9999px; }
    .acc-chevron { transition: transform .25s; }
    .acc-chevron.open { transform: rotate(180deg); }

    /* Status dot */
    .dot-green { background: #22c55e; }
    .dot-gray  { background: #d1d5db; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; margin-top: 1px; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <div id="sidebar-container"></div>

  <div class="pt-14 lg:pt-0 min-h-screen">
    <main class="p-6 max-w-5xl mx-auto">

      <!-- Header -->
      <div class="mb-6 anim anim-1">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
              <i class="fa-solid fa-vault text-amber-600"></i>
              Θησαυροφυλάκιο
            </h1>
            <p class="text-sm text-gray-500 mt-0.5">Διαπιστευτήρια ανά επιχείρηση — μόνο για super admin</p>
          </div>
          <div class="flex items-center gap-2">
            <span id="biz-count" class="text-xs text-gray-400 bg-white border border-gray-200 rounded-lg px-3 py-1.5 font-semibold"></span>
          </div>
        </div>
      </div>

      <!-- Security notice -->
      <div class="mb-5 p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-start gap-3 anim anim-1">
        <i class="fa-solid fa-triangle-exclamation text-amber-500 mt-0.5 flex-shrink-0"></i>
        <p class="text-xs text-amber-800 leading-relaxed">
          Αυτή η σελίδα περιέχει ευαίσθητα διαπιστευτήρια. Κάθε πρόσβαση καταγράφεται και αποστέλλεται email ειδοποίηση.
          Βεβαιωθείτε ότι δεν υπάρχει άλλο άτομο πίσω σας.
        </p>
      </div>

      <!-- Search -->
      <div class="mb-3 anim anim-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input id="search-input" type="text" placeholder="Αναζήτηση επιχείρησης — ονομασία, ΑΦΜ, email, πόλη…"
            class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-amber-400 bg-white shadow-sm"
            oninput="filterCards(this.value)">
        </div>
      </div>

      <!-- Filter chips -->
      <div id="filter-chips" class="mb-4 flex flex-wrap items-center gap-2 anim anim-2">
        <button class="f-chip active" data-filter="all" onclick="setFilter('all')">
          <i class="fa-solid fa-list text-xs"></i> Όλα
        </button>
        <button class="f-chip inactive" data-filter="has" onclick="setFilter('has')">
          <i class="fa-solid fa-circle-check text-xs"></i> Με κωδικούς
        </button>
        <button class="f-chip inactive" data-filter="none" onclick="setFilter('none')">
          <i class="fa-solid fa-circle-xmark text-xs"></i> Χωρίς κωδικούς
        </button>
        <span class="w-px h-5 bg-gray-200 self-center mx-1"></span>
        <span id="city-chips" class="flex flex-wrap gap-2"></span>
      </div>

      <!-- Cards container -->
      <div id="cards-container" class="space-y-3 anim anim-3">
        <!-- Skeleton -->
        <div class="bg-white rounded-xl border border-gray-100 p-5 animate-pulse">
          <div class="h-4 bg-gray-200 rounded w-1/3 mb-2"></div>
          <div class="h-3 bg-gray-200 rounded w-1/4"></div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 p-5 animate-pulse">
          <div class="h-4 bg-gray-200 rounded w-2/5 mb-2"></div>
          <div class="h-3 bg-gray-200 rounded w-1/3"></div>
        </div>
      </div>

      <p id="no-results" class="hidden text-center py-14 text-gray-400">
        <i class="fa-solid fa-magnifying-glass text-3xl mb-3 block opacity-30"></i>
        Δεν βρέθηκαν επιχειρήσεις
      </p>

    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    requireAuth();
    var _credUser     = getCurrentUser();
    var _credEmployee = _credUser && _credUser.role === 'employee';
    if (_credUser && _credUser.role !== 'super_admin' && _credUser.role !== 'employee') {
      location.href = 'dashboard.html';
    }
    buildSidebar();

    // ── State ──────────────────────────────────────────────────────────────────
    let _allBusinesses = [];
    let _activeFilter  = 'all'; // 'all' | 'has' | 'none' | 'city:X'

    // ── Init: OTP gate (super_admin) or privilege check (employee) → load ────
    window.addEventListener('load', async () => {
      if (_credEmployee) {
        // Employee: verify admin_credentials privilege
        try {
          const privRes = await api.get('/employees/my-privileges');
          if (!(privRes.privileges || []).includes('admin_credentials')) {
            document.getElementById('cards-container').innerHTML =
              '<div class="bg-red-50 border border-red-200 rounded-xl p-6 text-center">' +
              '<i class="fa-solid fa-lock text-red-400 text-3xl mb-2 block"></i>' +
              '<p class="text-sm font-semibold text-red-700">Δεν έχετε πρόσβαση στο Θησαυροφυλάκιο.</p>' +
              '<p class="text-xs text-gray-500 mt-1">Ζητήστε από τον Admin να σας δώσει δικαίωμα admin_credentials.</p>' +
              '</div>';
            return;
          }
        } catch { return; }
      } else {
        // Super admin: OTP gate + email notification
        try {
          await AdminOTP.requireSection();
        } catch {
          return;
        }
        if (!sessionStorage.getItem('fb_creds_notified')) {
          sessionStorage.setItem('fb_creds_notified', '1');
          api.post('/credentials/notify-access').catch(() => {});
        }
      }
      loadCredentials();
    });

    // ── Load all businesses with credentials ───────────────────────────────────
    async function loadCredentials() {
      try {
        const endpoint = _credEmployee ? '/employee-actions/credentials' : '/credentials';
        const res = await api.get(endpoint);
        _allBusinesses = res.data || [];
        document.getElementById('biz-count').textContent = `${_allBusinesses.length} επιχειρήσεις`;
        renderCityChips();
        renderCards(_allBusinesses);
      } catch (e) {
        document.getElementById('cards-container').innerHTML =
          `<div class="bg-red-50 text-red-600 rounded-xl p-4 text-sm">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i>${e.message}
          </div>`;
      }
    }

    // ── Render card list ───────────────────────────────────────────────────────
    function renderCards(businesses) {
      const container = document.getElementById('cards-container');
      const noRes     = document.getElementById('no-results');
      if (!businesses.length) {
        container.innerHTML = '';
        noRes.classList.remove('hidden');
        return;
      }
      noRes.classList.add('hidden');
      container.innerHTML = businesses.map(b => buildCard(b)).join('');
    }

    // ── Build a single card ────────────────────────────────────────────────────
    function buildCard(b) {
      const hasCreds = b.mydata_user_id || b.ospa_username ||
                       b.timologio_username || b.epsilon_username;
      const dot      = hasCreds ? 'dot-green' : 'dot-gray';
      const dotTitle = hasCreds ? 'Έχει διαπιστευτήρια' : 'Χωρίς διαπιστευτήρια';
      const updAt    = b.creds_updated_at
        ? `Ενημ. ${new Date(b.creds_updated_at).toLocaleDateString('el-GR')}`
        : '';

      return `
      <div class="cred-card bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden" data-search="${esc(b.name)} ${b.afm||''} ${b.email||''} ${b.city||''}">

        <!-- Card header (click to expand) -->
        <button type="button" onclick="toggleCard('${b.id}')"
          class="w-full flex items-center gap-3 px-5 py-4 text-left hover:bg-gray-50 transition-colors">
          <span class="status-dot ${dot}" title="${dotTitle}"></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-bold text-gray-900 text-sm">${esc(b.name)}</span>
              ${b.afm ? `<span class="text-xs text-gray-400 font-mono">ΑΦΜ ${b.afm}</span>` : ''}
              ${b.city ? `<span class="text-xs text-gray-400">${esc(b.city)}</span>` : ''}
            </div>
            <div class="flex items-center gap-3 mt-0.5 flex-wrap">
              ${b.email ? `<span class="text-xs text-gray-400">${esc(b.email)}</span>` : ''}
              ${b.phone ? `<span class="text-xs text-gray-400">${esc(b.phone)}</span>` : ''}
              ${updAt   ? `<span class="text-xs text-green-600">${updAt}</span>` : ''}
            </div>
          </div>
          <i class="fa-solid fa-chevron-down acc-chevron text-gray-400 text-sm" id="chev-${b.id}"></i>
        </button>

        <!-- Accordion body -->
        <div class="acc-body" id="body-${b.id}">
          <div class="px-5 pb-6 pt-1">
            <hr class="border-gray-100 mb-5">

            <!-- myDATA API -->
            <div class="cred-section border-teal-500 mb-5">
              <p class="text-xs font-bold text-teal-700 uppercase tracking-wider mb-3">
                <i class="fa-solid fa-link mr-1"></i>myDATA ΑΑΔΕ — API Keys
              </p>
              <div class="cred-row">
                ${textField(`mu-${b.id}`, 'ΑΑΔΕ User ID', b.mydata_user_id)}
                ${pwField(`mk-${b.id}`, 'Subscription Key', b.mydata_subscription_key)}
              </div>
            </div>

            <!-- OSPA -->
            <div class="cred-section border-indigo-400 mb-5">
              <p class="text-xs font-bold text-indigo-700 uppercase tracking-wider mb-3">
                <i class="fa-solid fa-fish mr-1"></i>ΟΣΠΑ — Σύστημα Αλιείας
              </p>
              <div class="cred-row">
                ${textField(`ou-${b.id}`, 'Όνομα χρήστη', b.ospa_username)}
                ${pwField(`op-${b.id}`, 'Κωδικός', b.ospa_password)}
              </div>
            </div>

            <!-- TIMOLOGIO -->
            <div class="cred-section border-green-500 mb-5">
              <p class="text-xs font-bold text-green-700 uppercase tracking-wider mb-3">
                <i class="fa-solid fa-file-invoice mr-1"></i>TIMOLOGIO (timologio.gr)
              </p>
              <div class="mb-2.5">
                ${textField(`ta-${b.id}`, 'ΑΦΜ', b.timologio_afm)}
              </div>
              <div class="cred-row">
                ${textField(`tu-${b.id}`, 'Όνομα χρήστη', b.timologio_username)}
                ${pwField(`tp-${b.id}`, 'Κωδικός', b.timologio_password)}
              </div>
            </div>

            <!-- Epsilon Smart -->
            <div class="cred-section border-orange-400 mb-5">
              <p class="text-xs font-bold text-orange-700 uppercase tracking-wider mb-3">
                <i class="fa-solid fa-bolt mr-1"></i>Epsilon Smart (epsilonsmart.gr)
              </p>
              <div class="cred-row">
                ${textField(`eu-${b.id}`, 'Όνομα χρήστη', b.epsilon_username)}
                ${pwField(`ep-${b.id}`, 'Κωδικός', b.epsilon_password)}
              </div>
            </div>

            <!-- Notes -->
            <div class="cred-section border-gray-300 mb-5">
              <p class="text-xs font-bold text-gray-600 uppercase tracking-wider mb-3">
                <i class="fa-solid fa-note-sticky mr-1"></i>Σημειώσεις
              </p>
              <textarea id="nt-${b.id}" rows="3" placeholder="Ελεύθερο κείμενο: ΑΦΜ, Δ.Ο.Υ., τηλέφωνα εφορίας, ειδικές οδηγίες…"
                class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-amber-400 resize-none"
              >${esc(b.extra_notes)}</textarea>
            </div>

            <!-- Save row -->
            <div class="flex items-center justify-between gap-3 mt-2">
              <span id="save-msg-${b.id}" class="text-xs text-gray-400"></span>
              <button onclick="saveCredentials('${b.id}')" id="save-btn-${b.id}"
                class="px-5 py-2 bg-amber-600 text-white text-sm font-bold rounded-xl hover:bg-amber-700 transition-colors shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> Αποθήκευση
              </button>
            </div>
          </div>
        </div>
      </div>`;
    }

    // ── Field builders ─────────────────────────────────────────────────────────

    function textField(id, label, value) {
      return `
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">${label}</label>
          <div class="relative">
            <input id="${id}" type="text" value="${esc(value)}" autocomplete="off" spellcheck="false"
              class="w-full px-3 py-2 pr-9 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-amber-400 font-mono">
            <div class="absolute right-2 top-1/2 -translate-y-1/2">
              <button type="button" onclick="copyField('${id}')" id="copy-${id}"
                class="pw-btn text-gray-400 hover:text-gray-600 bg-transparent" title="Αντιγραφή">
                <i class="fa-solid fa-copy text-xs"></i>
              </button>
            </div>
          </div>
        </div>`;
    }

    function pwField(id, label, value) {
      return `
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">${label}</label>
          <div class="pw-wrap">
            <input id="${id}" type="password" value="${esc(value)}" autocomplete="new-password" spellcheck="false"
              class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-amber-400 font-mono">
            <div class="pw-actions">
              <button type="button" onclick="togglePw('${id}')" id="eye-${id}"
                class="pw-btn text-gray-400 hover:text-gray-600 bg-transparent" title="Εμφάνιση/Απόκρυψη">
                <i class="fa-solid fa-eye text-xs" id="eye-icon-${id}"></i>
              </button>
              <button type="button" onclick="copyField('${id}')" id="copy-${id}"
                class="pw-btn text-gray-400 hover:text-gray-600 bg-transparent" title="Αντιγραφή">
                <i class="fa-solid fa-copy text-xs"></i>
              </button>
            </div>
          </div>
        </div>`;
    }

    // ── Accordion ──────────────────────────────────────────────────────────────
    let _openId = null;

    function toggleCard(id) {
      const body = document.getElementById(`body-${id}`);
      const chev = document.getElementById(`chev-${id}`);
      const isOpen = body.classList.contains('open');

      // Close any currently open card
      if (_openId && _openId !== id) {
        const prevBody = document.getElementById(`body-${_openId}`);
        const prevChev = document.getElementById(`chev-${_openId}`);
        if (prevBody) prevBody.classList.remove('open');
        if (prevChev) prevChev.classList.remove('open');
      }

      body.classList.toggle('open', !isOpen);
      chev.classList.toggle('open', !isOpen);
      _openId = !isOpen ? id : null;

      if (!isOpen) {
        // Scroll card into view nicely
        body.closest('.cred-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // ── Password toggle ────────────────────────────────────────────────────────
    function togglePw(fieldId) {
      const input    = document.getElementById(fieldId);
      const icon     = document.getElementById(`eye-icon-${fieldId}`);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.className = isHidden ? 'fa-solid fa-eye-slash text-xs' : 'fa-solid fa-eye text-xs';
    }

    // ── Copy to clipboard ──────────────────────────────────────────────────────
    async function copyField(fieldId) {
      const input = document.getElementById(fieldId);
      const val   = input?.value;
      if (!val) return;
      try {
        await navigator.clipboard.writeText(val);

        // Flash input border green
        input.classList.remove('copy-flash');
        void input.offsetWidth; // reflow to restart animation
        input.classList.add('copy-flash');
        input.addEventListener('animationend', () => input.classList.remove('copy-flash'), { once: true });

        // Floating "Αντιγράφηκε!" toast on the wrapping container
        const btn  = document.getElementById(`copy-${fieldId}`);
        const wrap = btn?.closest('.pw-wrap, .relative');
        if (wrap) {
          const toast = document.createElement('span');
          toast.className   = 'copy-toast';
          toast.textContent = 'Αντιγράφηκε!';
          wrap.appendChild(toast);
          toast.addEventListener('animationend', () => toast.remove(), { once: true });
        }

        // Brief check mark on button
        if (btn) {
          btn.classList.add('copy-ok');
          btn.innerHTML = '<i class="fa-solid fa-check text-xs"></i>';
          setTimeout(() => {
            btn.classList.remove('copy-ok');
            btn.innerHTML = '<i class="fa-solid fa-copy text-xs"></i>';
          }, 1500);
        }
      } catch {}
    }

    // ── Save credentials ───────────────────────────────────────────────────────
    async function saveCredentials(bizId) {
      const btn = document.getElementById(`save-btn-${bizId}`);
      const msg = document.getElementById(`save-msg-${bizId}`);
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Αποθήκευση…';
      msg.textContent = '';
      msg.className   = 'text-xs text-gray-400';

      const payload = {
        mydata_user_id:          v(`mu-${bizId}`),
        mydata_subscription_key: v(`mk-${bizId}`),
        ospa_username:           v(`ou-${bizId}`),
        ospa_password:           v(`op-${bizId}`),
        timologio_username:      v(`tu-${bizId}`),
        timologio_password:      v(`tp-${bizId}`),
        timologio_afm:           v(`ta-${bizId}`),
        epsilon_username:        v(`eu-${bizId}`),
        epsilon_password:        v(`ep-${bizId}`),
        extra_notes:             document.getElementById(`nt-${bizId}`)?.value.trim() || '',
      };

      try {
        const saveEndpoint = _credEmployee ? `/employee-actions/credentials/${bizId}` : `/credentials/${bizId}`;
        await api.put(saveEndpoint, payload);
        msg.textContent = '✓ Αποθηκεύτηκε';
        msg.className   = 'text-xs text-green-600 font-semibold';
        // Update local state so status dot updates
        const biz = _allBusinesses.find(b => b.id === bizId);
        if (biz) Object.assign(biz, payload, { creds_updated_at: new Date().toISOString() });
        // Refresh dot
        const dot = document.querySelector(`[data-search]` + `[data-search="${esc(biz?.name||'')} ${biz?.afm||''} ${biz?.email||''} ${biz?.city||''}"] .status-dot`);
        // Simple: reload after save to refresh dots
        setTimeout(async () => {
          msg.textContent = '';
          try {
            const res = await api.get('/credentials');
            _allBusinesses = res.data || [];
            // Re-render only the changed card header to update dot — just reload the whole list
            const q = document.getElementById('search-input').value;
            filterCards(q);
            // Re-open the same card
            const body = document.getElementById(`body-${bizId}`);
            if (body && !body.classList.contains('open')) {
              // card was re-rendered, re-open it
              toggleCard(bizId);
            }
          } catch {}
        }, 1200);
      } catch (e) {
        msg.textContent = `✗ ${e.message}`;
        msg.className   = 'text-xs text-red-600 font-semibold';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Αποθήκευση';
      }
    }

    // ── Filter ─────────────────────────────────────────────────────────────────
    function filterCards(q) {
      const term = (q || '').toLowerCase().trim();
      let filtered = _allBusinesses;

      // Text search
      if (term) {
        filtered = filtered.filter(b =>
          `${b.name} ${b.afm||''} ${b.email||''} ${b.city||''}`
            .toLowerCase().includes(term)
        );
      }

      // Chip filter
      if (_activeFilter === 'has') {
        filtered = filtered.filter(b =>
          b.gsis_username || b.mydata_user_id || b.ospa_username ||
          b.timologio_username || b.epsilon_username
        );
      } else if (_activeFilter === 'none') {
        filtered = filtered.filter(b =>
          !b.gsis_username && !b.mydata_user_id && !b.ospa_username &&
          !b.timologio_username && !b.epsilon_username
        );
      } else if (_activeFilter.startsWith('city:')) {
        const city = _activeFilter.slice(5).toLowerCase();
        filtered = filtered.filter(b => (b.city||'').toLowerCase() === city);
      }

      _openId = null;
      renderCards(filtered);
    }

    function setFilter(f) {
      _activeFilter = f;
      document.querySelectorAll('[data-filter]').forEach(el => {
        el.className = `f-chip ${el.dataset.filter === f ? 'active' : 'inactive'}`;
      });
      filterCards(document.getElementById('search-input').value);
    }

    function renderCityChips() {
      const cities = [...new Set(_allBusinesses.map(b => b.city).filter(Boolean))].sort();
      const wrap   = document.getElementById('city-chips');
      if (!wrap) return;
      wrap.innerHTML = cities.map(c => `
        <button class="f-chip inactive" data-filter="city:${esc(c)}" onclick="setFilter('city:${esc(c)}')">
          <i class="fa-solid fa-location-dot text-xs"></i> ${esc(c)}
        </button>`).join('');
    }

    // ── Helpers ────────────────────────────────────────────────────────────────
    function v(id) {
      return document.getElementById(id)?.value.trim() || '';
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

  </script>
</body>
</html>
