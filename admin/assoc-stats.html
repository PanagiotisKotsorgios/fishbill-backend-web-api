<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FishBill – Στατιστικά Συλλόγων</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    .stat-card { transition: transform .15s, box-shadow .15s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .anim { animation: fadeUp .35s ease-out both; }
    .progress-bar { transition: width .5s ease; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<div id="sidebar-container"></div>

<div class="pt-14 lg:pt-0 min-h-screen">
  <main class="p-6">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6 anim">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Στατιστικά Συλλόγων</h1>
        <p class="text-sm text-gray-500 mt-0.5">Χρήστες, δραστηριότητα &amp; κερδοφορία ανά σύλλογο</p>
      </div>
      <button onclick="load()" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition-colors shadow-sm">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Ανανέωση
      </button>
    </div>

    <!-- Summary cards -->
    <div id="summary-cards" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6 anim"></div>

    <!-- Association cards -->
    <div id="assoc-list" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
  async function load() {
    document.getElementById('assoc-list').innerHTML = '<div class="col-span-2 text-center py-12 text-gray-300 text-sm">Φόρτωση…</div>';

    try {
      const res = await api.get('/configure/association-stats');
      const { data: assocs, unassociated: unassoc } = res;

      // ── Summary totals ────────────────────────────────────────────────────
      const totalBiz     = assocs.reduce((s,a) => s + (a.business_count||0), 0) + (unassoc.business_count||0);
      const totalActive  = assocs.reduce((s,a) => s + (a.active_subscriptions||0), 0) + (unassoc.active_subscriptions||0);
      const totalDebt    = assocs.reduce((s,a) => s + parseFloat(a.total_outstanding||0), 0) + parseFloat(unassoc.total_outstanding||0);
      const totalInv     = assocs.reduce((s,a) => s + (a.total_invoices||0), 0) + (unassoc.total_invoices||0);

      document.getElementById('summary-cards').innerHTML = `
        ${summaryCard('Σύλλογοι', assocs.length, 'text-blue-600', 'bg-blue-50')}
        ${summaryCard('Επιχειρήσεις', totalBiz, 'text-teal-600', 'bg-teal-50')}
        ${summaryCard('Ενεργές Συνδρομές', totalActive, 'text-emerald-600', 'bg-emerald-50')}
        ${summaryCard('Εκκρεμείς Οφειλές', '€' + totalDebt.toFixed(2), totalDebt > 0 ? 'text-red-600' : 'text-gray-500', totalDebt > 0 ? 'bg-red-50' : 'bg-gray-50')}
      `;

      // ── Per-association cards ──────────────────────────────────────────────
      const rows = [...assocs];
      if (unassoc.business_count > 0) {
        rows.push({ id: null, name: 'Χωρίς Σύλλογο', region: null, ...unassoc });
      }

      if (!rows.length) {
        document.getElementById('assoc-list').innerHTML = '<div class="col-span-2 text-center py-12 text-gray-300 text-sm">Δεν βρέθηκαν σύλλογοι</div>';
        return;
      }

      document.getElementById('assoc-list').innerHTML = rows.map(a => assocCard(a)).join('');

    } catch (e) {
      document.getElementById('assoc-list').innerHTML = `<div class="col-span-2 text-center py-12 text-red-400 text-sm">Σφάλμα φόρτωσης: ${e.message}</div>`;
    }
  }

  function summaryCard(label, value, textCls, bgCls) {
    return `
      <div class="stat-card ${bgCls} rounded-xl border border-gray-100 shadow-sm p-4">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">${label}</p>
        <p class="text-2xl font-extrabold ${textCls}">${value}</p>
      </div>`;
  }

  function assocCard(a) {
    const biz     = parseInt(a.business_count || 0);
    const active  = parseInt(a.active_subscriptions || 0);
    const inactive= parseInt(a.inactive_subscriptions || 0);
    const users   = parseInt(a.user_count || 0);
    const debt    = parseFloat(a.total_outstanding || 0);
    const invTotal= parseInt(a.total_invoices || 0);
    const invMonth= parseInt(a.invoices_this_month || 0);
    const pct     = biz > 0 ? Math.round((active / biz) * 100) : 0;

    const payColor = pct >= 80 ? 'bg-emerald-500' : pct >= 50 ? 'bg-amber-400' : 'bg-red-500';
    const pctColor = pct >= 80 ? 'text-emerald-600' : pct >= 50 ? 'text-amber-600' : 'text-red-600';
    const isUnassoc = a.id === null;

    return `
      <div class="stat-card bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
        <!-- Header -->
        <div class="flex items-start justify-between mb-4">
          <div>
            <h2 class="font-bold text-gray-900 text-lg leading-tight">${escHtml(a.name)}</h2>
            ${a.region ? `<p class="text-xs text-gray-400 mt-0.5">${escHtml(a.region)}</p>` : ''}
          </div>
          ${isUnassoc ? '<span class="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded-full font-semibold">Αταξινόμητοι</span>' : ''}
        </div>

        <!-- Stats grid -->
        <div class="grid grid-cols-3 gap-3 mb-4">
          <div class="bg-gray-50 rounded-xl p-3 text-center">
            <p class="text-2xl font-extrabold text-blue-700">${biz}</p>
            <p class="text-xs text-gray-400 mt-0.5">Επιχειρήσεις</p>
          </div>
          <div class="bg-gray-50 rounded-xl p-3 text-center">
            <p class="text-2xl font-extrabold text-teal-700">${users}</p>
            <p class="text-xs text-gray-400 mt-0.5">Χρήστες</p>
          </div>
          <div class="bg-gray-50 rounded-xl p-3 text-center">
            <p class="text-2xl font-extrabold text-indigo-700">${invMonth}</p>
            <p class="text-xs text-gray-400 mt-0.5">Τιμ/α μήνα</p>
          </div>
        </div>

        <!-- Payment consistency -->
        <div class="mb-4">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-semibold text-gray-500">Συνέπεια Πληρωμών</span>
            <span class="text-xs font-bold ${pctColor}">${pct}% (${active}/${biz})</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-2">
            <div class="progress-bar ${payColor} h-2 rounded-full" style="width:${pct}%"></div>
          </div>
          <div class="flex justify-between mt-1">
            <span class="text-xs text-emerald-600">${active} ενεργές</span>
            <span class="text-xs text-red-500">${inactive} ανενεργές</span>
          </div>
        </div>

        <!-- Bottom row -->
        <div class="flex items-center justify-between pt-3 border-t border-gray-50">
          <div>
            <p class="text-xs text-gray-400">Σύνολο Παραστατικών</p>
            <p class="font-bold text-gray-700">${invTotal.toLocaleString('el-GR')}</p>
          </div>
          <div class="text-right">
            <p class="text-xs text-gray-400">Εκκρεμείς Οφειλές</p>
            <p class="font-bold ${debt > 0 ? 'text-red-600' : 'text-gray-400'}">€${debt.toFixed(2)}</p>
          </div>
        </div>
      </div>`;
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  requireAuth();
  buildSidebar();
  load();
</script>
</body>
</html>
