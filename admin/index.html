<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FishBill – Πύλη Διαχειριστών</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent2:  #1976D2;
      --primary:  #0D47A1;
      --err:      #D32F2F;
      --err-bg:   #FFEBEE;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #0D47A1 0%, #1565C0 35%, #1976D2 65%, #1E88E5 85%, #42A5F5 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0 16px 48px;
      overflow-x: hidden;
    }

    /* ── PARTICLES ── */
    .particle {
      position: fixed;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      animation: floatUp linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(105vh) scale(0); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: .5; }
      100% { transform: translateY(-8vh) scale(1); opacity: 0; }
    }

    /* ── ENTRANCE ANIMATIONS ── */
    @keyframes fishIn {
      from { opacity: 0; transform: scale(0.55) translateY(-20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.07); }
    }

    .page-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
    }

    /* ── HEADER ── */
    .logo-section {
      text-align: center;
      padding: 52px 0 28px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      animation: fishIn .65s cubic-bezier(.34,1.56,.64,1) both,
                 breathe 4s ease-in-out .75s infinite;
    }
    .app-title {
      font-size: 52px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 6px;
      animation: fadeUp .6s ease-out .18s both;
    }
    .app-sub {
      font-size: 15px;
      color: rgba(255,255,255,.65);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 600;
      animation: fadeUp .6s ease-out .3s both;
    }

    .admin-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      background: rgba(251,191,36,.15);
      border: 1px solid rgba(251,191,36,.38);
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 700;
      color: #FCD34D;
      letter-spacing: .06em;
      text-transform: uppercase;
      animation: fadeUp .6s ease-out .42s both;
    }
    .admin-pill svg { width: 14px; height: 14px; fill: #FCD34D; }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.08);
      padding: 32px 26px;
      animation: fadeUp .65s ease-out .54s both;
    }

    .card-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 16px;
      color: #8a9ab0;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .access-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      border-radius: 12px;
      padding: 11px 14px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #92400E;
      line-height: 1.45;
    }
    .access-notice svg { width: 16px; height: 16px; fill: #D97706; flex-shrink: 0; margin-top: 1px; }

    /* ── FIELDS ── */
    .field-wrap { margin-bottom: 14px; }

    .outlined-field {
      position: relative;
      border: 2px solid #CFD8DC;
      border-radius: 14px;
      background: #F8FAFC;
      display: flex;
      align-items: center;
      transition: border-color .18s, background .18s;
    }
    .outlined-field:focus-within {
      border-color: var(--accent2);
      background: #fff;
    }
    .outlined-field .field-icon {
      flex-shrink: 0;
      width: 48px;
      display: flex; align-items: center; justify-content: center;
    }
    .outlined-field .field-icon svg { width: 20px; height: 20px; fill: #90A4AE; transition: fill .18s; }
    .outlined-field:focus-within .field-icon svg { fill: var(--accent2); }

    .outlined-field .floating-label {
      position: absolute;
      left: 48px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #78909C;
      pointer-events: none;
      transition: all .15s;
      background: transparent;
      padding: 0 4px;
    }
    .outlined-field.active .floating-label,
    .outlined-field input:not(:placeholder-shown) ~ .floating-label {
      top: 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent2);
      background: #fff;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .outlined-field input {
      flex: 1;
      padding: 17px 14px 14px 0;
      border: none;
      outline: none;
      font-size: 16px;
      font-family: inherit;
      color: #0D47A1;
      background: transparent;
      min-width: 0;
    }
    .outlined-field input::placeholder { color: transparent; }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px #F8FAFC inset;
      -webkit-text-fill-color: #0D47A1;
    }

    .pw-toggle {
      flex-shrink: 0;
      width: 46px;
      height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
    }
    .pw-toggle svg { width: 20px; height: 20px; fill: #90A4AE; transition: fill .15s; }
    .pw-toggle:hover svg { fill: var(--accent2); }

    /* ── ALERTS ── */
    .alert-err {
      background: var(--err-bg); border: 1px solid #FFCDD2;
      border-radius: 12px; padding: 13px 15px;
      display: flex; align-items: flex-start; gap: 8px;
      margin-bottom: 14px; font-size: 15px; color: var(--err);
    }
    .alert-icon { font-size: 18px; flex-shrink: 0; }
    .hidden { display: none !important; }

    /* ── PRIMARY BUTTON ── */
    .btn-primary {
      width: 100%;
      height: 62px;
      background: linear-gradient(135deg, #0D47A1, #1565C0);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 6px 20px rgba(13,71,161,.45);
      transition: transform .12s, box-shadow .12s, opacity .15s;
      margin-top: 6px;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(13,71,161,.55); }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn-primary svg { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }

    /* ── SPINNER ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ── BACK LINK ── */
    .back-link {
      text-align: center;
      margin-top: 20px;
      animation: fadeUp .6s ease-out .68s both;
    }
    .back-link a {
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,.55);
      font-size: 13px; font-weight: 500;
      text-decoration: none;
      transition: color .15s;
    }
    .back-link a:hover { color: rgba(255,255,255,.88); }
    .back-link svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      margin-top: 22px;
      animation: fadeIn .6s ease-out .82s both;
    }
    .footer a, .footer span {
      color: rgba(255,255,255,.4);
      font-size: 12px; text-decoration: none;
    }
    .footer a:hover { color: rgba(255,255,255,.7); }
    .dot { margin: 0 5px; }
  </style>
</head>
<body>


  <div class="page-wrap">

    <!-- Logo -->
    <div class="logo-section">
      <div class="logo-badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="200" height="133">
          <path fill="#0D47A1" d="M38,60 L5,32 L18,60 L5,88 Z"/>
          <path fill="#1976D2" d="M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z"/>
          <path fill="#42A5F5" d="M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z"/>
          <path stroke="#1565C0" stroke-width="1.5" fill="none" d="M85,38 C88,55 85,65 82,82"/>
          <path stroke="#1565C0" stroke-width="1.5" fill="none" d="M110,33 C113,50 110,65 107,87"/>
          <path fill="#0D47A1" d="M70,38 C80,8 110,8 120,35 L105,40 L90,38 Z"/>
          <path fill="#0D47A1" d="M80,88 C88,108 102,108 110,86 Z"/>
          <circle cx="138" cy="60" r="10" fill="#FFFFFF"/>
          <circle cx="138" cy="60" r="5"  fill="#1A237E"/>
          <circle cx="136" cy="57" r="2.2" fill="#FFFFFF"/>
          <path stroke="#0D47A1" stroke-width="2" fill="none" stroke-linecap="round" d="M160,63 C163,67 163,70 160,72"/>
        </svg>
      </div>

      <div class="app-title">FishBill</div>
      <div class="app-sub">Ηλεκτρονική Τιμολόγηση Αλιείας</div>
      <div class="admin-pill">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l5 2.18V11c0 3.5-2.33 6.79-5 7.93C9.33 17.79 7 14.5 7 11V7.18L12 5z"/></svg>
        Πύλη Διαχειριστών
      </div>
    </div>

    <!-- Login card -->
    <div class="card">
      <div class="card-title">Διαχείριση Συστήματος</div>
      <div class="card-sub">Συνδεθείτε με τα διαχειριστικά σας στοιχεία</div>

      <!-- Restricted access notice -->
      <div class="access-notice">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span>Πρόσβαση μόνο για εξουσιοδοτημένους διαχειριστές. Μη εξουσιοδοτημένες προσπάθειες καταγράφονται.</span>
      </div>

      <div id="error-msg" class="alert-err hidden">
        <span class="alert-icon"><i class="fas fa-triangle-exclamation"></i></span>
        <div>
          <p id="error-text" style="font-weight:600"></p>
          <p id="error-detail" class="hidden" style="font-size:12px;margin-top:2px;opacity:.8"></p>
        </div>
      </div>

      <!-- Email -->
      <div class="field-wrap">
        <div class="outlined-field" id="f-email">
          <div class="field-icon">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </div>
          <input id="email" type="email" placeholder=" " autocomplete="email"
            onfocus="this.closest('.outlined-field').classList.add('active')"
            onblur="this.closest('.outlined-field').classList.remove('active')"
            onkeydown="if(event.key==='Enter')doLogin()" />
          <span class="floating-label">Email Διαχειριστή</span>
        </div>
      </div>

      <!-- Password -->
      <div class="field-wrap">
        <div class="outlined-field" id="f-pass">
          <div class="field-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </div>
          <input id="password" type="password" placeholder=" " autocomplete="current-password"
            onfocus="this.closest('.outlined-field').classList.add('active')"
            onblur="this.closest('.outlined-field').classList.remove('active')"
            onkeydown="if(event.key==='Enter')doLogin()" />
          <span class="floating-label">Κωδικός</span>
          <button class="pw-toggle" onclick="togglePw(this)">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-primary" id="login-btn" onclick="doLogin()">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l5 2.18V11c0 3.5-2.33 6.79-5 7.93C9.33 17.79 7 14.5 7 11V7.18L12 5z"/></svg>
        ΣΥΝΔΕΣΗ ΔΙΑΧΕΙΡΙΣΤΗ
      </button>
    </div>

    <!-- Back link -->
    <div class="back-link" style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <a href="../">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Κύρια Ιστοσελίδα FishBill
      </a>
    </div>

    <div class="footer">
      FishBill &copy; 2026
    </div>
  </div>

  <script src="js/config.js?v=2"></script>
  <script src="js/api.js?v=2"></script>
  <script>
    // ── Redirect if already authenticated as admin ──
    (function() {
      try {
        if (typeof getToken === 'undefined') return;
        const tok = getToken();
        if (tok) {
          const u = getUser && getUser();
          if (u && u.exp * 1000 > Date.now() && u.role === 'super_admin') {
            window.location.replace('dashboard.html');
          } else {
            if (typeof clearToken === 'function') clearToken();
          }
        }
      } catch(e) {}
    })();

    // ── Password toggle ──
    const EYE_OPEN = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
    const EYE_OFF  = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
    function togglePw(btn) {
      const inp = document.getElementById('password');
      const hide = inp.type === 'password';
      inp.type = hide ? 'text' : 'password';
      btn.querySelector('svg').innerHTML = hide ? EYE_OFF : EYE_OPEN;
    }

    // ── Loading state ──
    function setLoading(loading) {
      const b = document.getElementById('login-btn');
      b.disabled = loading;
      b.innerHTML = loading
        ? '<div class="spinner"></div>'
        : '<svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#fff;flex-shrink:0"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l5 2.18V11c0 3.5-2.33 6.79-5 7.93C9.33 17.79 7 14.5 7 11V7.18L12 5z"/></svg> ΣΥΝΔΕΣΗ ΔΙΑΧΕΙΡΙΣΤΗ';
    }

    // ── Show error ──
    function showError(msg, detail) {
      const errDiv  = document.getElementById('error-msg');
      const errText = document.getElementById('error-text');
      const errDet  = document.getElementById('error-detail');
      errText.textContent = msg;
      errDiv.classList.remove('hidden');
      if (detail) {
        errDet.textContent = detail;
        errDet.classList.remove('hidden');
      } else {
        errDet.classList.add('hidden');
      }
    }

    // ── LOGIN ──
    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      document.getElementById('error-msg').classList.add('hidden');

      if (!email || !password) {
        showError('Συμπληρώστε email και κωδικό.');
        return;
      }

      setLoading(true);
      try {
        const res = await api.post('/auth/admin-login', { email, password });

        if (res && res.data && res.data.access_token) {
          const user = res.data.user;

          // Only allow super_admin through this portal
          if (!user || user.role !== 'super_admin') {
            throw new Error('Αυτή η πύλη είναι αποκλειστικά για διαχειριστές συστήματος.');
          }

          setToken(res.data.access_token, res.data.refresh_token);
          setCurrentUser(user);
          window.location.replace('dashboard.html');
        } else {
          throw new Error('Μη έγκυρη απάντηση από τον server.');
        }
      } catch(e) {
        const raw = (e.message || '').toLowerCase();
        let msg = 'Σφάλμα σύνδεσης. Παρακαλώ δοκιμάστε ξανά.';
        if (raw.includes('port 4000') || raw.includes('δεν είναι δυνατή') || raw.includes('api server')) {
          msg = 'Δεν είναι δυνατή η σύνδεση με τον API server. Ελέγξτε αν ο server τρέχει στο port 4000.';
        } else if (raw.includes('403') || raw.includes('αποκλειστικά') || raw.includes('διαχειριστές')) {
          msg = 'Αυτή η πύλη είναι αποκλειστικά για διαχειριστές συστήματος.';
        } else if (raw.includes('401') || raw.includes('invalid') || raw.includes('unauthorized') || raw.includes('wrong') || raw.includes('incorrect') || raw.includes('credentials')) {
          msg = 'Λάθος email ή κωδικός πρόσβασης. Ελέγξτε τα στοιχεία σας και δοκιμάστε ξανά.';
        } else if (raw.includes('not found') || raw.includes('404') || raw.includes('no user')) {
          msg = 'Δεν βρέθηκε λογαριασμός με αυτό το email.';
        } else if (raw.includes('network') || raw.includes('fetch') || raw.includes('timeout')) {
          msg = 'Πρόβλημα σύνδεσης δικτύου. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά.';
        } else if (raw.includes('too many') || raw.includes('rate limit') || raw.includes('429')) {
          msg = 'Πολλές αποτυχημένες προσπάθειες. Παρακαλώ περιμένετε λίγο και δοκιμάστε ξανά.';
        } else if (raw.includes('500') || raw.includes('503')) {
          msg = 'Προσωρινό πρόβλημα στον server. Παρακαλώ δοκιμάστε ξανά σε λίγο.';
        } else if (e.message && !raw.includes('error') && !raw.includes('exception')) {
          msg = e.message;
        }
        const detail = (typeof CONFIG !== 'undefined' && CONFIG.DEBUG)
          ? 'API: ' + CONFIG.API_URL + '/auth/admin-login' : null;
        showError(msg, detail);
      } finally {
        setLoading(false);
      }
    }
  </script>
</body>
</html>
