# ─────────────────────────────────────────────────────────────────────────────
# FishBill — Apache VirtualHost
#
# Requirements:
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo a2ensite fishbill
#   sudo systemctl reload apache2
#
# Replace:
#   your-domain.com  → your actual domain (or server IP)
#   /var/www/fishbill → path where you cloned the repo
# ─────────────────────────────────────────────────────────────────────────────

<VirtualHost *:80>
    ServerName  your-domain.com
    ServerAlias www.your-domain.com
    DocumentRoot /var/www/fishbill

    # ── Proxy to Node.js API (runs on localhost:4000 via PM2) ─────────────────
    ProxyRequests     Off
    ProxyPreserveHost On

    ProxyPass        /api/      http://127.0.0.1:4000/api/
    ProxyPassReverse /api/      http://127.0.0.1:4000/api/

    ProxyPass        /health    http://127.0.0.1:4000/health
    ProxyPassReverse /health    http://127.0.0.1:4000/health

    ProxyPass        /apk/      http://127.0.0.1:4000/apk/
    ProxyPassReverse /apk/      http://127.0.0.1:4000/apk/

    ProxyPass        /avatars/  http://127.0.0.1:4000/avatars/
    ProxyPassReverse /avatars/  http://127.0.0.1:4000/avatars/

    ProxyPass        /uploads/  http://127.0.0.1:4000/uploads/
    ProxyPassReverse /uploads/  http://127.0.0.1:4000/uploads/

    ProxyPass        /pdfs/     http://127.0.0.1:4000/pdfs/
    ProxyPassReverse /pdfs/     http://127.0.0.1:4000/pdfs/

    # ── Static web root ───────────────────────────────────────────────────────
    <Directory /var/www/fishbill>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted

        # Security headers
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"

        # Cache fingerprinted assets for 1 year
        <FilesMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>

        # Never cache HTML
        <FilesMatch "\.html$">
            Header set Cache-Control "no-store, no-cache, must-revalidate"
        </FilesMatch>
    </Directory>

    # Block access to sensitive files
    <FilesMatch "\.(env|sh|sql|log|bak|key|pem|md|bat)$">
        Require all denied
    </FilesMatch>

    # Increase upload limit (avatars, PDFs, weighing-slip photos)
    LimitRequestBody 20971520

    ErrorLog  ${APACHE_LOG_DIR}/fishbill-error.log
    CustomLog ${APACHE_LOG_DIR}/fishbill-access.log combined
</VirtualHost>

# ── HTTPS (add after running: certbot --apache -d your-domain.com) ───────────
# Certbot will automatically create and manage the SSL VirtualHost block.
