services:

  # ── MySQL 8 ────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME:-fishbill_db}
      MYSQL_USER:          ${DB_USER:-fishbill_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/fishbill_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      disable: true

  # ── FishBill Node.js API (production) ─────────────────────────────────────
  api:
    build:
      context: ./fishbill-api
    restart: unless-stopped
    command: ["./entrypoint.sh"]
    environment:
      DB_HOST:                  db
      DB_PORT:                  "3306"
      NODE_ENV:                 ${NODE_ENV:-production}
      PORT:                     ${PORT:-4000}
      DB_NAME:                  ${DB_NAME:-fishbill_db}
      DB_USER:                  ${DB_USER:-fishbill_user}
      APP_URL:                  ${APP_URL:-https://master-app.gr}
      API_URL:                  ${API_URL:-https://master-app.gr/api}
      APP_BASE_URL:             ${APP_BASE_URL:-https://master-app.gr}
      CORS_ORIGINS:             ${CORS_ORIGINS:-https://master-app.gr}
      ADMIN_EMAIL:              ${ADMIN_EMAIL:-pkotsorgios654@gmail.com}
      JWT_EXPIRES_IN:           ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN:   ${JWT_REFRESH_EXPIRES_IN:-30d}
      DB_PASSWORD:              ${DB_PASSWORD}
      JWT_SECRET:               ${JWT_SECRET}
      JWT_REFRESH_SECRET:       ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY:           ${ENCRYPTION_KEY}
      ADMIN_PASSWORD:           ${ADMIN_PASSWORD:-}
      PLATFORM_GSIS_USERNAME:   ${PLATFORM_GSIS_USERNAME:-}
      PLATFORM_GSIS_PASSWORD:   ${PLATFORM_GSIS_PASSWORD:-}
      PLATFORM_GSIS_CALLER_AFM: ${PLATFORM_GSIS_CALLER_AFM:-}
    depends_on:
      db:
        condition: service_started
    volumes:
      - api_uploads:/app/uploads
      - api_pdfs:/app/pdfs
      - api_avatars:/app/public/avatars
      - api_weighing_slips:/app/public/uploads
      - api_apk:/app/public/apk
      - api_backups:/app/backups

  # ── Αγρότης Node.js API (STAGING Wrapp — completely separate) ─────────────
  # Shares the MySQL container but uses `ag_*` prefixed tables so it never
  # collides with FishBill data. Own JWT secret, own admin table, own Wrapp
  # partner key that MUST point at Wrapp staging.
  agrotis-api:
    build:
      context: ./agrotis-api
    restart: unless-stopped
    environment:
      NODE_ENV:               ${NODE_ENV:-production}
      PORT:                   "4001"
      DB_HOST:                db
      DB_PORT:                "3306"
      DB_NAME:                ${DB_NAME:-fishbill_db}
      DB_USER:                ${DB_USER:-fishbill_user}
      DB_PASSWORD:            ${DB_PASSWORD}
      # ── Own JWT secret — MUST be a different value from JWT_SECRET above ─
      JWT_SECRET:             ${AGROTIS_JWT_SECRET}
      JWT_ACCESS_TTL:         ${AGROTIS_JWT_ACCESS_TTL:-1d}
      JWT_REFRESH_TTL:        ${AGROTIS_JWT_REFRESH_TTL:-30d}
      # ── Wrapp STAGING sandbox — never production ─────────────────────────
      WRAPP_BASE_URL:         ${AGROTIS_WRAPP_BASE_URL:-https://staging.wrapp.ai/api/v1}
      WRAPP_PARTNER_API_KEY:  ${AGROTIS_WRAPP_PARTNER_API_KEY}
      WRAPP_WEBHOOK_SECRET:   ${AGROTIS_WRAPP_WEBHOOK_SECRET:-}
      # ── Super-admin bootstrap (only used on first migrate) ──────────────
      BOOTSTRAP_ADMIN_EMAIL:    ${AGROTIS_BOOTSTRAP_ADMIN_EMAIL:-admin@agrotis.gr}
      BOOTSTRAP_ADMIN_PASSWORD: ${AGROTIS_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_started
    volumes:
      - agrotis_uploads:/app/uploads
      - agrotis_pdfs:/app/pdfs

  # ── Nginx (static web + reverse proxy for BOTH APIs) ──────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      disable: true
    depends_on:
      - api
      - agrotis-api

volumes:
  db_data:
  api_uploads:
  api_pdfs:
  api_avatars:
  api_weighing_slips:
  api_apk:
  api_backups:
  agrotis_uploads:
  agrotis_pdfs:
