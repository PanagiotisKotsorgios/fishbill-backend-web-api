services:

  # ── MySQL 8 ────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME:-fishbill_db}
      MYSQL_USER:          ${DB_USER:-fishbill_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/fishbill_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Node.js API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./fishbill-api
    restart: unless-stopped
    command: ["./entrypoint.sh"]
    environment:
      DB_HOST:                  db
      DB_PORT:                  "3306"
      NODE_ENV:                 ${NODE_ENV:-production}
      PORT:                     ${PORT:-4000}
      DB_NAME:                  ${DB_NAME:-fishbill_db}
      DB_USER:                  ${DB_USER:-fishbill_user}
      APP_URL:                  ${APP_URL:-https://master-app.gr}
      API_URL:                  ${API_URL:-https://master-app.gr/api}
      APP_BASE_URL:             ${APP_BASE_URL:-https://master-app.gr}
      CORS_ORIGINS:             ${CORS_ORIGINS:-https://master-app.gr}
      ADMIN_EMAIL:              ${ADMIN_EMAIL:-pkotsorgios654@gmail.com}
      JWT_EXPIRES_IN:           ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN:   ${JWT_REFRESH_EXPIRES_IN:-30d}
      DB_PASSWORD:              ${DB_PASSWORD}
      JWT_SECRET:               ${JWT_SECRET}
      JWT_REFRESH_SECRET:       ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY:           ${ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
      - api_pdfs:/app/pdfs
      - api_avatars:/app/public/avatars
      - api_weighing_slips:/app/public/uploads
      - api_apk:/app/public/apk
      - api_backups:/app/backups

  # ── Nginx (static web + reverse proxy) ────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      disable: true
    depends_on:
      - api

volumes:
  db_data:
  api_uploads:
  api_pdfs:
  api_avatars:
  api_weighing_slips:
  api_apk:
  api_backups:
