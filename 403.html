<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 120'><path fill='%230A5568' d='M38,60 L5,32 L18,60 L5,88 Z'/><path fill='%230B7285' d='M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z'/><path fill='%2338BEC9' d='M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z'/><circle cx='138' cy='60' r='10' fill='%23FFFFFF'/><circle cx='138' cy='60' r='5' fill='%23064E60'/><circle cx='136' cy='57' r='2.2' fill='%23FFFFFF'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 – Χωρίς Πρόσβαση | FishBill</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(180deg, #092B36 0%, #0B4A5C 45%, #0D3544 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
    }

    .wrap { max-width: 520px; width: 100%; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px) rotate(-3deg); }
      40% { transform: translateX(10px) rotate(3deg); }
      60% { transform: translateX(-6px) rotate(-1.5deg); }
      80% { transform: translateX(6px) rotate(1.5deg); }
    }
    .fish-icon {
      display: inline-block;
      animation: shake 3.5s ease-in-out infinite;
      margin-bottom: 8px;
    }

    .err-code {
      font-size: clamp(80px, 18vw, 140px);
      font-weight: 900;
      color: #EF9A9A;
      line-height: 1;
      letter-spacing: -4px;
      text-shadow: 0 0 60px rgba(239,154,154,.3);
      margin-bottom: 8px;
    }

    .err-title {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 800;
      color: #fff;
      margin-bottom: 14px;
    }

    .err-desc {
      font-size: clamp(16px, 3vw, 20px);
      color: rgba(255,255,255,.72);
      line-height: 1.65;
      margin-bottom: 44px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 380px;
      margin: 0 auto;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 68px;
      background: #38BEC9;
      color: #092B36;
      border: none;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .5px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      box-shadow: 0 8px 28px rgba(56,190,201,.35);
      transition: transform .12s, box-shadow .12s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(56,190,201,.45); }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary svg { width: 24px; height: 24px; fill: #092B36; flex-shrink: 0; }

    .btn-outline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 68px;
      background: transparent;
      color: #fff;
      border: 2.5px solid rgba(255,255,255,.55);
      border-radius: 18px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: background .12s, border-color .12s, transform .12s;
    }
    .btn-outline:hover { background: rgba(255,255,255,.1); border-color: #fff; transform: translateY(-1px); }
    .btn-outline svg { width: 24px; height: 24px; fill: #fff; flex-shrink: 0; }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(239,154,154,.15);
      border: 1.5px solid rgba(239,154,154,.4);
      border-radius: 100px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      color: #EF9A9A;
      letter-spacing: .06em;
      margin-bottom: 24px;
    }
    .lock-badge svg { width: 14px; height: 14px; fill: #EF9A9A; }

    .footer-note {
      margin-top: 40px;
      font-size: 13px;
      color: rgba(255,255,255,.35);
    }
    .footer-note a { color: rgba(255,255,255,.55); text-decoration: none; }
    .footer-note a:hover { color: rgba(255,255,255,.85); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="fish-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="180" height="120">
      <path fill="#0A5568" d="M38,60 L5,32 L18,60 L5,88 Z"/>
      <path fill="#0B7285" d="M38,60 C48,25 155,28 168,60 C155,92 48,95 38,60 Z"/>
      <path fill="#38BEC9" d="M55,60 C65,42 145,44 155,60 C145,76 65,78 55,60 Z"/>
      <path stroke="#065666" stroke-width="1.5" fill="none" d="M85,38 C88,55 85,65 82,82"/>
      <path stroke="#065666" stroke-width="1.5" fill="none" d="M110,33 C113,50 110,65 107,87"/>
      <path fill="#0A5568" d="M70,38 C80,8 110,8 120,35 L105,40 L90,38 Z"/>
      <path fill="#0A5568" d="M80,88 C88,108 102,108 110,86 Z"/>
      <circle cx="138" cy="60" r="10" fill="#FFFFFF"/>
      <circle cx="138" cy="60" r="5"  fill="#064E60"/>
      <circle cx="136" cy="57" r="2.2" fill="#FFFFFF"/>
      <path stroke="#0A5568" stroke-width="2" fill="none" stroke-linecap="round" d="M160,63 C163,67 163,70 160,72"/>
    </svg>
  </div>

  <div class="err-code">403</div>
  <div class="err-title">Δεν έχετε πρόσβαση!</div>

  <div class="lock-badge">
    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    ΑΠΑΓΟΡΕΥΕΤΑΙ Η ΠΡΟΣΒΑΣΗ
  </div>

  <p class="err-desc">
    Δεν έχετε τα απαραίτητα δικαιώματα για να δείτε αυτή τη σελίδα. Αν νομίζετε ότι αυτό είναι λάθος, επικοινωνήστε με τον διαχειριστή.
  </p>

  <div class="btn-group">
    <a href="/fishbill/" class="btn-primary">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Αρχική Σελίδα
    </a>
    <a href="/fishbill/app/" class="btn-outline">
      <svg viewBox="0 0 24 24"><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>
      Σύνδεση / Είσοδος
    </a>
  </div>

  <div class="footer-note">
    FishBill &copy; 2026 &nbsp;·&nbsp;
    <a href="/fishbill/app/">Σύνδεση Ψαράδων</a> &nbsp;·&nbsp;
    <a href="/fishbill/accountant/">Πύλη Λογιστών</a>
  </div>
</div>
</body>
</html>
