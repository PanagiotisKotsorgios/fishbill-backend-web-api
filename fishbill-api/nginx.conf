# ─────────────────────────────────────────────────────────────────────────────
# FishBill — Production Nginx Configuration
#
# 1. Copy this file to /etc/nginx/sites-available/fishbill
# 2. ln -s /etc/nginx/sites-available/fishbill /etc/nginx/sites-enabled/fishbill
# 3. Replace every occurrence of:
#      YOUR_DOMAIN        → your actual domain  (e.g. fishbill.gr)
#      YOUR_API_DOMAIN    → your API subdomain  (e.g. api.fishbill.gr)
#      /var/www/fishbill  → path to your web app files
# 4. Install Certbot and run:
#      certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN -d YOUR_API_DOMAIN
# 5. nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones (defined in http block, but shown here for reference)
# Add these inside your nginx.conf http { } block if not already present:
#   limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
#   limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/m;

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN YOUR_API_DOMAIN;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API server (api.YOUR_DOMAIN → Node.js on :4000) ──────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_API_DOMAIN;

    # SSL — managed by Certbot (paths added automatically)
    ssl_certificate     /etc/letsencrypt/live/YOUR_API_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_API_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

    # Gzip
    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 1024;

    # Proxy to Node.js
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        # Body size (for PDF uploads, avatar images)
        client_max_body_size 20M;
    }

    # Tighter rate limit on auth endpoints
    location ~* ^/api/auth/(login|forgot-password|owner-recovery) {
        limit_req zone=api_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (no rate limit)
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }
}

# ── Web app (YOUR_DOMAIN → static HTML files) ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/fishbill;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://YOUR_API_DOMAIN;" always;

    # Gzip
    gzip on;
    gzip_types text/html application/javascript text/css application/json;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # HTML files — no cache (so users always get latest)
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # Block access to sensitive files
    location ~* \.(env|sh|sql|log|bak)$ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
