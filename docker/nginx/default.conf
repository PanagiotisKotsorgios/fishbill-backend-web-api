server {
    listen 80;
    server_name _;

    # Docker's internal DNS — resolves service names dynamically so Nginx
    # doesn't fail to start if an api container is temporarily unavailable
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /var/www/fishbill;
    index index.html;

    # Allow larger uploads (avatars, PDFs, weighing-slip images)
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (TLS/HSTS handled by your load-balancer / reverse proxy)
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Long-lived cache for fingerprinted static assets
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Never cache HTML
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # Block direct access to sensitive file types
    location ~* \.(env|sh|sql|log|bak|key|pem)$ {
        deny all;
        return 404;
    }

    # Health check endpoint — returns 200 directly, no file I/O, no proxy
    location = /ping {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Αγρότης API — strip the /agrotis/api prefix and forward to agrotis-api.
    # This MUST come before the generic /api proxy below so /agrotis/api/*
    # is matched by this location and not by FishBill's.
    location /agrotis/api/ {
        proxy_pass         http://agrotis-api:4001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Αγρότης admin panel — SPA-lite: fall back to its own index.html
    location /agrotis/admin/ {
        try_files $uri $uri/ /agrotis/admin/index.html;
    }

    # Αγρότης legal pages
    location /agrotis/legal/ {
        try_files $uri $uri/ =404;
    }

    # ── FishBill API proxy (unchanged) ───────────────────────────────────
    location ~ ^/(api|health|apk|avatars|uploads|pdfs)(/|$) {
        set $api http://api:4000;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Custom error pages
    error_page 400 401          /admin/401.html;
    error_page 403              /admin/403.html;
    error_page 404              /admin/404.html;
    error_page 500              /admin/500.html;
    error_page 502 503 504      /admin/503.html;

    location = /admin/401.html { internal; }
    location = /admin/403.html { internal; }
    location = /admin/404.html { internal; }
    location = /admin/500.html { internal; }
    location = /admin/503.html { internal; }

    # Everything else: serve from static web root
    location / {
        try_files $uri $uri/ /admin/404.html;
    }
}
