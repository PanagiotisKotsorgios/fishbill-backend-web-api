<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Δελτία Αποστολής · Αγρότης Superadmin</title>
  <link rel="stylesheet" href="css/shell.css" />
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    if (!requireLogin()) throw new Error('no session');
    renderShell('delivery-notes.html');
  </script>

  <template id="mainTpl">
    <h1>Δελτία Αποστολής</h1>
    <div class="page-subtitle">Όλα τα εκδοθέντα δελτία αποστολής (9.3) — από όλες τις επιχειρήσεις</div>
    <div class="pill-bar">
      <input id="q" placeholder="Αναζήτηση (πελάτης / επιχείρηση / όχημα)…" oninput="applyFilter()" />
      <span id="totalCount" class="stat-hint">—</span>
    </div>
    <table class="data">
      <thead>
        <tr>
          <th>Ημ/νία</th><th>Επιχείρηση</th><th>Πελάτης</th>
          <th>Όχημα</th><th>Δρομολ.</th><th>Σειρά</th><th>Αρ.</th>
          <th>myDATA MARK</th><th>Κατάσταση</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="9" class="empty">Φόρτωση…</td></tr></tbody>
    </table>
  </template>

  <script>
    document.querySelector('main.content').innerHTML =
      document.getElementById('mainTpl').innerHTML;
    let allRows = [];
    function statusBadge(dn) {
      if (dn.cancelled_by_mark) return '<span class="badge red">Ακυρώθηκε</span>';
      if (dn.my_data_mark)      return '<span class="badge green">Εκδοθέν</span>';
      return '<span class="badge grey">Draft</span>';
    }
    function renderRows(rows) {
      const tbody = document.getElementById('rows');
      if (!rows.length) { tbody.innerHTML = `<tr><td colspan="9" class="empty">Κανένα δελτίο</td></tr>`; return; }
      tbody.innerHTML = rows.map(dn => `
        <tr>
          <td>${fmtDate(dn.created_at)}</td>
          <td>${escapeHtml(dn.business_name || '—')}</td>
          <td>${escapeHtml(dn.customer_name || '—')}</td>
          <td><code style="font-size:11px;">${escapeHtml(dn.vehicle_number || '—')}</code></td>
          <td style="font-size:12px;">${escapeHtml(dn.dispatch_date || '—')}</td>
          <td>${escapeHtml(dn.series || '—')}</td>
          <td>${dn.num ?? '—'}</td>
          <td><code style="font-size:11px;">${escapeHtml(dn.my_data_mark || '—')}</code></td>
          <td>${statusBadge(dn)}</td>
        </tr>`).join('');
    }
    function applyFilter() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      if (!q) return renderRows(allRows);
      renderRows(allRows.filter(dn =>
        (dn.customer_name || '').toLowerCase().includes(q) ||
        (dn.business_name || '').toLowerCase().includes(q) ||
        (dn.vehicle_number || '').toLowerCase().includes(q)
      ));
    }
    (async () => {
      try {
        const resp = await api.deliveryNotes({ page: 1, limit: 100 });
        allRows = resp.data;
        document.getElementById('totalCount').textContent = `${resp.meta.total} συνολικά`;
        renderRows(allRows);
      } catch (e) {
        document.getElementById('rows').innerHTML =
          `<tr><td colspan="9" class="empty">Σφάλμα: ${escapeHtml(e.message)}</td></tr>`;
      }
    })();
  </script>
</body>
</html>
